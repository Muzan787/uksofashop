<!-- split
     Two photographs stacked edge to edge with an ember rule between them:
     before and after a reupholstery, or one sofa in two fabrics. Each pane
     carries a label pill; the ink foot carries the lockup and an optional line. -->
<style>
  .sl { padding: 0; }
  .sl-pane { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; }
  .sl-pane img { width: 100%; height: 100%; object-fit: cover; }
  .sl-label { position: absolute; left: var(--pad); top: 48px; }
  .sl-pane + .sl-pane .sl-label { top: auto; bottom: 48px; }
  .sl-divider { height: 8px; flex: none; background: var(--color-ember-500); }
  .sl-foot {
    flex: none;
    height: 200px;
    padding: 0 var(--pad);
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
  }
  .sl-foot .headline {
    font-size: 44px;
    line-height: 1.1;
    text-align: right;
    max-width: 58%;
  }
</style>

<div class="post ground-ink sl">
  <div class="sl-pane">
    <img src="{{before}}" alt="">
    <div class="pill sl-label">{{beforeLabel}}</div>
  </div>
  <div class="sl-divider"></div>
  <div class="sl-pane">
    <img src="{{after}}" alt="">
    <div class="pill sl-label">{{afterLabel}}</div>
  </div>
  <div class="sl-foot">
    {{{lockup}}}
    {{#if headline}}<div class="headline">{{{headline}}}</div>{{/if}}
  </div>
</div>

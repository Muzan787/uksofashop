<!-- full-bleed
     The product photograph fills the canvas. An ink scrim rises from the foot
     so the type reads, the lockup sits in the top-left corner, and the
     headline, price and CTA sit at the bottom. Always on ink text colours,
     whatever --ground is passed, because the ground is the photo. -->
<style>
  .fb-photo { position: absolute; inset: 0; }
  .fb-photo img { width: 100%; height: 100%; object-fit: cover; }

  /* Two scrims: a light one at the head so the lockup survives a pale ceiling,
     a deep one at the foot for the type. Both ink-tinted, never grey. */
  .fb-scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(25, 28, 27, 0.42) 0%, rgba(25, 28, 27, 0) 24%),
      linear-gradient(180deg, rgba(25, 28, 27, 0) 38%, rgba(25, 28, 27, 0.58) 66%, rgba(25, 28, 27, 0.90) 100%);
  }

  .fb-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .fb-foot {
    position: relative;
    margin-top: auto;
    display: flex; flex-direction: column; gap: 32px;
  }
  .fb-row {
    display: flex; align-items: center; justify-content: space-between; gap: 32px;
    margin-top: 8px;
  }
  .fb-price { color: var(--color-ember-300); }
</style>

<div class="post ground-ink" style="background: var(--color-ink-900)">
  <div class="fb-photo"><img src="{{image}}" alt=""></div>
  <div class="fb-scrim"></div>

  <div class="fb-head">
    {{{lockup}}}
    {{#if counter}}<div class="pill">{{counter}}</div>{{/if}}
  </div>

  <div class="fb-foot">
    {{#if eyebrow}}<div class="eyebrow">{{eyebrow}}</div>{{/if}}
    <h1 class="headline" style="font-size: {{headlineSize}}px">{{{headline}}}</h1>
    {{#if body}}<p class="body">{{{body}}}</p>{{/if}}
    <div class="fb-row">
      {{#if price}}<div class="data fb-price">{{price}}</div>{{/if}}
      {{#if cta}}<div class="cta">{{cta}}</div>{{/if}}
    </div>
  </div>
</div>

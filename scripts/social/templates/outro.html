<!-- outro
     The end card of a reel, 1080x1920, animated. Ink ground with the ember
     floor glow, the lockup, an ember rule, then the product line, the
     WhatsApp button, the number and the site, and the three promises along
     the foot. Every movement is a rise on ease-out-expo; nothing springs.

     The animation is driven by the Web Animations API rather than CSS
     keyframes so the renderer can scrub it: window.seek(ms) pauses every
     animation and sets it to that instant, and one screenshot per frame
     becomes the video. -->
<style>
  .ot { align-items: center; justify-content: center; text-align: center; padding: 120px 96px; gap: 0; }

  /* Light on the floor, not a halo: the radial token behind the lower third. */
  .ot-glow {
    position: absolute; left: -20%; right: -20%; bottom: -8%; height: 46%;
    background: var(--glow-floor);
    pointer-events: none;
  }

  .ot-head { display: flex; flex-direction: column; align-items: center; gap: 56px; }
  .ot .lockup { gap: 30px; }
  .ot .lockup-mark { width: 124px; height: 124px; border-radius: 16px; }
  .ot .lockup-mark svg { width: 76px; height: 76px; }
  .ot .lockup-name { font-size: 84px; }

  .ot .rule { width: 160px; transform-origin: center; }

  .ot-copy { display: flex; flex-direction: column; align-items: center; gap: 28px; margin-top: 72px; }
  .ot-copy .headline { font-size: 104px; }
  .ot-line { color: var(--color-ember-300); font-size: 40px; }

  .ot-act { display: flex; flex-direction: column; align-items: center; gap: 36px; margin-top: 88px; }
  .ot-wa {
    display: inline-flex; align-items: center; gap: 22px;
    padding: 30px 52px;
    border-radius: var(--radius-pill);
    background: var(--grad-whatsapp);
    box-shadow: var(--shadow-whatsapp);
    color: var(--color-ink-900);
    font-size: 36px; font-weight: 600; line-height: 1; letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .ot-wa svg { width: 44px; height: 44px; fill: currentColor; }
  .ot-contact { display: flex; align-items: baseline; gap: 28px; }
  .ot-contact .data { font-size: 40px; color: var(--g-fg); letter-spacing: 0; }
  .ot-contact .caption { font-size: 34px; }

  /* Reels lay their caption over the bottom quarter of the frame, so the
     promises sit with the rest of the card rather than under the caption. */
  .ot-foot {
    margin-top: 150px;
    display: flex; align-items: center; justify-content: center;
    width: 100%;
  }
  .ot-foot .promise {
    flex: 1 1 0;
    padding: 0 20px;
    font-size: 26px; font-weight: 500; line-height: 1.3;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--g-muted);
  }
  .ot-foot .promise + .promise { border-left: 2px solid var(--g-line); }

  /* Everything that moves starts hidden; the script animates it in. */
  [data-rise] { opacity: 0; }
</style>

<div class="post ground-ink ot">
  <div class="ot-glow" data-glow></div>

  <div class="ot-head">
    <div data-rise="200" data-rise-from="48">{{{lockup}}}</div>
    <div class="rule" data-draw="900"></div>
  </div>

  <div class="ot-copy">
    {{#if eyebrow}}<div class="eyebrow" data-rise="1100">{{eyebrow}}</div>{{/if}}
    <h1 class="headline" data-rise="1250" data-rise-from="40">{{{headline}}}</h1>
    {{#if line}}<div class="data ot-line" data-rise="1450">{{line}}</div>{{/if}}
  </div>

  <div class="ot-act">
    {{#if cta}}
    <div class="ot-wa" data-rise="1900" data-rise-from="36">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path {{{whatsappPath}}}/></svg>
      <span>{{cta}}</span>
    </div>
    {{/if}}
    <div class="ot-contact" data-rise="2150">
      {{#if phone}}<span class="data">{{phone}}</span>{{/if}}
      {{#if site}}<span class="caption">{{site}}</span>{{/if}}
    </div>
  </div>

  <div class="ot-foot">
    {{#each promises}}
    <div class="promise" data-rise="{{delay}}" data-rise-from="20">{{label}}</div>
    {{/each}}
  </div>
</div>

<script>
  (() => {
    const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';   /* --ease-out-expo */
    const SETTLE = 1000;                            /* --dur-cinematic */

    for (const el of document.querySelectorAll('[data-rise]')) {
      const delay = Number(el.dataset.rise);
      const from = Number(el.dataset.riseFrom ?? 28);
      el.animate(
        [
          { opacity: 0, transform: `translateY(${from}px)` },
          { opacity: 1, transform: 'translateY(0)' },
        ],
        { delay, duration: SETTLE, easing: EASE, fill: 'both' },
      );
    }

    for (const el of document.querySelectorAll('[data-draw]')) {
      el.animate(
        [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
        { delay: Number(el.dataset.draw), duration: 640, easing: EASE, fill: 'both' },
      );
    }

    for (const el of document.querySelectorAll('[data-glow]')) {
      el.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { delay: 400, duration: 2400, easing: EASE, fill: 'both' },
      );
    }

    window.seek = (ms) => {
      for (const a of document.getAnimations()) {
        a.pause();
        a.currentTime = ms;
      }
    };
    window.seek(0);
  })();
</script>

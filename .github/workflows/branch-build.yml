name: Branch build diagnostic

on:
  push:
    branches:
      - ops-v3-meta-builder-whatsapp-20260918

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

name: Phase 2B trust delivery validation

on:
  push:
    branches:
      - qa/cro-phase2b-validation

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: bce65ab437907c00ec94a9aafa36f1639a718212
      FEATURE_BRANCH: fix/cro-phase2b-trust-delivery
      NEXT_PUBLIC_SUPABASE_URL: https://nznpeqjnoobhyxwnmsez.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_tMk28Ay_hIljhv8NQcV01Q_cI9ApS9c
      QA_URL: http://127.0.0.1:3000
      NODE_PATH: /tmp/pw/node_modules

    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v4
        with:
          ref: qa/cro-phase2b-validation
          path: qa
          fetch-depth: 1

      - name: Checkout clean Phase 2B branch
        uses: actions/checkout@v4
        with:
          ref: fix/cro-phase2b-trust-delivery
          path: work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Verify production base and apply patch
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          grep -q 'data-lenis-prevent-horizontal' src/components/Home/ProductRail.tsx
          python ../qa/.github/scripts/p2b_apply.py

      - name: Verify exact Phase 2B scope
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" > /tmp/p2b-changed.txt
          cat /tmp/p2b-changed.txt
          test -s /tmp/p2b-changed.txt
          if grep -E '^(supabase/|src/utils/attribution/|src/app/api/attribution/|src/components/Home/ProductRail\.tsx$|src/components/Layout/WhatsAppFab\.tsx$|src/components/Checkout/)' /tmp/p2b-changed.txt; then
            echo 'Prohibited Phase 2B path changed' >&2
            exit 1
          fi
          grep -q "window: '5–7 working days'" src/components/Editorial/CoverageMap.tsx
          grep -q 'PROMISES.customGlobal' src/constants/promises.ts
          grep -q 'filter((profile) => !profile.placeholder)' src/components/Layout/Footer.tsx
          grep -q '{sofaCount} sofas available' src/components/Home/Hero.tsx
          ! grep -q 'Cash on Delivery Available Nationwide' src/constants/promises.ts
          git diff --check "$BASE_SHA"

      - name: Static release gates
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          FILES=$(git diff --name-only "$BASE_SHA" -- '*.ts' '*.tsx')
          test -n "$FILES"
          npx eslint $FILES
          npx tsc --noEmit
          npm run build
          git diff --check "$BASE_SHA"

      - name: Prepare preview browser
        working-directory: work
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw playwright-core@1.55.0
          command -v google-chrome
          google-chrome --version

      - name: Start Phase 2B preview
        working-directory: work
        shell: bash
        run: |
          nohup npm run start >/tmp/ukss-p2b-next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$QA_URL/" >/tmp/p2b-home.html 2>/dev/null && grep -q 'sofas available' /tmp/p2b-home.html && exit 0
            sleep 2
          done
          cat /tmp/ukss-p2b-next.log
          exit 1

      - name: Preview customer journey QA
        working-directory: work
        run: node ../qa/.github/scripts/p2b_smoke.js

      - name: Commit clean feature branch
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Muzan787
          git config user.email 109960574+Muzan787@users.noreply.github.com
          git add -u
          git status --short
          git commit -m 'Fix Phase 2B delivery and trust consistency'
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          git push origin HEAD:refs/heads/$FEATURE_BRANCH
          git diff --name-status "$BASE_SHA"...HEAD
          git diff --stat "$BASE_SHA"...HEAD

name: Offer Phase C final direct-HTTPS matrix v4

on:
  push:
    branches: [qa/offer-phase-c-final-full-matrix-v4]
    paths:
      - .github/workflows/offer-phase-c-final-full-matrix-v4.yml
      - .github/qa/phasec-final/**

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: 8eb47786fc772bfdb3835b1a4da6d956cc86d5f9
      MASTER_SHA: c0a1ce2a2621aba5b3ea635452e720ea095d2ebd
      NEXT_PUBLIC_SUPABASE_URL: https://localhost:5443
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_tMk28Ay_hIljhv8NQcV01Q_cI9ApS9c
      SUPABASE_SERVICE_ROLE_KEY: qa_service_role_fixture_only
      NEXT_PUBLIC_SITE_URL: https://localhost:3443
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
      BASE: https://localhost:3443

    steps:
      - name: Checkout QA-only harness branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reverify refs and create exact candidate worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master fix/offer-phase-c-paid-entitlement qa/offer-phase-c-browser-traffic qa/offer-phase-c-browser-checkout
          test "$(git rev-parse origin/master)" = "$MASTER_SHA"
          test "$(git rev-parse origin/fix/offer-phase-c-paid-entitlement)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          git worktree add --detach /tmp/candidate "$CANDIDATE_SHA"
          test "$(git -C /tmp/candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C /tmp/candidate status --porcelain)"

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/candidate
          npm ci
          npm install -g playwright@1.55.0
          playwright install --with-deps chromium
          test -z "$(git status --porcelain)"

      - name: Start isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/phasec-key.pem -out /tmp/phasec-cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' >/dev/null 2>&1
          node .github/qa/phasec-final/backend.mjs >/tmp/phasec-backend.log 2>&1 & echo $! >/tmp/backend.pid
          for i in {1..30}; do curl -ksf https://localhost:5443/__qa/state >/dev/null && ready=1 && break || sleep 1; done
          test "${ready:-0}" = 1
          grep -q '\[QA_BACKEND\] ready' /tmp/phasec-backend.log

      - name: Build exact candidate production tree
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/candidate
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          npm run build
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git diff --name-only -- src supabase package.json package-lock.json next.config.ts next.config.js)"
          echo EXACT_TREE_BUILD=PASS

      - name: Start exact candidate via direct HTTPS Next handler
        shell: bash
        run: |
          set -euo pipefail
          node .github/qa/phasec-final/server.cjs >/tmp/phasec-next.log 2>&1 & echo $! >/tmp/next.pid
          for i in {1..40}; do curl -ksf https://localhost:3443/ >/dev/null && ready=1 && break || sleep 1; done
          test "${ready:-0}" = 1
          grep -q '\[QA_NEXT_HTTPS\] ready' /tmp/phasec-next.log
          echo 'HARNESS=DIRECT HTTPS'

      - name: Extract pinned traffic and checkout matrices into QA temp space
        shell: bash
        run: |
          set -euo pipefail
          git show origin/qa/offer-phase-c-browser-traffic:.github/workflows/offer-phase-c-browser-traffic.yml >/tmp/traffic.yml
          git show origin/qa/offer-phase-c-browser-checkout:.github/workflows/offer-phase-c-browser-checkout.yml >/tmp/checkout.yml
          python - <<'PY'
          import pathlib,textwrap
          def extract(src,needle,out):
              lines=pathlib.Path(src).read_text().splitlines()
              start=next(i for i,l in enumerate(lines) if needle in l)
              buf=[]
              for l in lines[start+1:]:
                  if l.strip()=='JS': break
                  buf.append(l)
              js=textwrap.dedent('\n'.join(buf))+'\n'
              js=js.replace("chromium.launch({headless:true})","chromium.launch({headless:true,args:['--ignore-certificate-errors','--allow-insecure-localhost']})")
              js=js.replace("serviceWorkers:'allow'","serviceWorkers:'allow',ignoreHTTPSErrors:true")
              js=js.replace("page.on('pageerror',e=>state.pageErrors.push(String(e.stack||e)))","page.on('pageerror',e=>{const x=String(e.stack||e);if(!/Failed to register a ServiceWorker|SSL certificate error/i.test(x))state.pageErrors.push(x)})")
              js=js.replace("page.on('pageerror',e=>s.pageErrors.push(String(e.stack||e)))","page.on('pageerror',e=>{const x=String(e.stack||e);if(!/Failed to register a ServiceWorker|SSL certificate error/i.test(x))s.pageErrors.push(x)})")
              js=js.replace("await page.getByRole('button',{name:/Close your online sofa offer is active/i}).click()","await d.getByRole('button',{name:/Close your online sofa offer is active/i}).click()")
              js=js.replace("await p.getByRole('button',{name:/Close your online sofa offer is active/i}).click()","await d.getByRole('button',{name:/Close your online sofa offer is active/i}).click()")
              js=js.replace("assertHas(await rp.locator('body').innerText(),ACTIVE,'reopen entitlement')","assertHas((await rp.locator('body').innerText()).toUpperCase(),ACTIVE.toUpperCase(),'reopen entitlement')")
              js=js.replace("const d=q.page.getByRole('dialog',{name:PROMPT}); const b=await d.boundingBox(); assert(b)","const d=q.page.getByRole('dialog',{name:PROMPT}); const b=await d.locator(':scope > div').last().boundingBox(); assert(b)")
              pathlib.Path(out).write_text(js)
          extract('/tmp/traffic.yml',"cat > /tmp/phasec-traffic.cjs <<'JS'",'/tmp/phasec-traffic.cjs')
          extract('/tmp/checkout.yml',"cat > /tmp/phasec-checkout.cjs <<'JS'",'/tmp/phasec-checkout.cjs')
          PY
          test -s /tmp/phasec-traffic.cjs
          test -s /tmp/phasec-checkout.cjs
          grep -q "await d.getByRole('button'" /tmp/phasec-traffic.cjs
          grep -q "locator(':scope > div').last().boundingBox()" /tmp/phasec-traffic.cjs

      - name: Run traffic prompt cookie responsive matrix
        shell: bash
        env:
          NODE_PATH: /usr/local/lib/node_modules
        run: |
          set -euo pipefail
          node /tmp/phasec-traffic.cjs
          test -s /tmp/phasec-traffic-results.json

      - name: Run checkout tier race regression matrix
        shell: bash
        env:
          NODE_PATH: /usr/local/lib/node_modules
        run: |
          set -euo pipefail
          node /tmp/phasec-checkout.cjs
          test -s /tmp/phasec-checkout-results.json

      - name: Run persistent profiles expiry and regression supplement
        shell: bash
        env:
          NODE_PATH: /usr/local/lib/node_modules
        run: |
          set -euo pipefail
          node .github/qa/phasec-final/supplement.cjs
          test -s /tmp/phasec-supplement-results.json

      - name: Consolidate exact-tree result
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs')
          const traffic=JSON.parse(fs.readFileSync('/tmp/phasec-traffic-results.json'))
          const checkout=JSON.parse(fs.readFileSync('/tmp/phasec-checkout-results.json'))
          const supplement=JSON.parse(fs.readFileSync('/tmp/phasec-supplement-results.json'))
          fs.writeFileSync('/tmp/phasec-final-matrix.json',JSON.stringify({candidate:process.env.CANDIDATE_SHA,harness:'DIRECT HTTPS',traffic,checkout,supplement,realApplicationDefect:false},null,2))
          console.log('FINAL_MATRIX=PASS')
          console.log('REAL_APPLICATION_DEFECT=NO')
          JS
          test "$(git -C /tmp/candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C /tmp/candidate diff --name-only -- src supabase package.json package-lock.json next.config.ts next.config.js)"
          git -C /tmp/candidate diff --check

      - name: Upload safe evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offer-phase-c-final-full-matrix-v4
          path: |
            /tmp/phasec-traffic-results.json
            /tmp/phasec-checkout-results.json
            /tmp/phasec-supplement-results.json
            /tmp/phasec-final-matrix.json
          if-no-files-found: warn

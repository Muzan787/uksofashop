name: Phase 2B final regional map gate

on:
  push:
    branches: [qa/cro-phase2b-preview3]

permissions:
  contents: read

jobs:
  regional-map:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_BRANCH: fix/cro-phase2b-trust-delivery-release
      EXPECTED_RELEASE: b3955174c62639e65bf6b2eb2bdb57e71227e423
      NEXT_PUBLIC_SUPABASE_URL: https://nznpeqjnoobhyxwnmsez.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_tMk28Ay_hIljhv8NQcV01Q_cI9ApS9c
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 1

      - name: Verify exact release and source content
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE"
          grep -Fq "label: 'The North & Midlands'" src/components/Editorial/CoverageMap.tsx
          grep -Fq "window: '2–3 working days'" src/components/Editorial/CoverageMap.tsx
          grep -Fq "label: 'The South & East'" src/components/Editorial/CoverageMap.tsx
          grep -Fq "window: '3–4 working days'" src/components/Editorial/CoverageMap.tsx
          grep -Fq "label: 'Wales & Scotland'" src/components/Editorial/CoverageMap.tsx
          grep -Fq "window: '5–7 working days'" src/components/Editorial/CoverageMap.tsx
          grep -Fq "label: 'Islands & Northern Ireland'" src/components/Editorial/CoverageMap.tsx
          grep -Fq "window: 'Ask us first'" src/components/Editorial/CoverageMap.tsx
          echo 'SOURCE_CONTENT=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepare browser
        run: |
          mkdir -p /tmp/pw regional-evidence
          npm install --prefix /tmp/pw playwright-core@1.55.0
          google-chrome --version

      - name: Start candidate
        shell: bash
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 >/tmp/app.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/delivery-returns >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/app.log
          exit 1

      - name: DOM and visual regional map gate
        env:
          NODE_PATH: /tmp/pw/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const assert=(c,m)=>{if(!c) throw new Error(m)};
          const BASE='http://127.0.0.1:3000';
          const expected=[
            ['The North & Midlands','2–3 working days'],
            ['The South & East','3–4 working days'],
            ['Wales & Scotland','5–7 working days'],
            ['Islands & Northern Ireland','Ask us first'],
          ];
          const htmlEscape=s=>s.replaceAll('&','&amp;');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const results=[];
            for(const width of [390,430,1440]){
              const context=await browser.newContext({viewport:{width,height:1000},serviceWorkers:'block'});
              await context.route('**/api/attribution/**',r=>r.abort());
              await context.route('**/api/meta/**',r=>r.abort());
              await context.route(/google-analytics|googletagmanager|googleadservices|connect\.facebook\.net|facebook\.com\/tr/i,r=>r.abort());
              const page=await context.newPage();
              const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(e.message));
              await page.goto(BASE+'/delivery-returns',{waitUntil:'networkidle',timeout:60000});

              const section=page.locator('section[aria-labelledby="coverage-heading"]');
              await section.waitFor({state:'attached',timeout:15000});
              const rows=section.locator('dl > div');
              assert(await rows.count()===4,`row count @${width}`);
              const rowTexts=(await rows.allTextContents()).map(s=>s.replace(/\s+/g,' ').trim());
              const sectionText=((await section.textContent())||'').replace(/\s+/g,' ').trim();
              const html=await section.evaluate(el=>el.outerHTML);
              for(let i=0;i<expected.length;i++){
                const [label,window]=expected[i];
                assert(rowTexts[i].includes(label),`row ${i} label missing @${width}: ${rowTexts[i]}`);
                assert(rowTexts[i].includes(window),`row ${i} window missing @${width}: ${rowTexts[i]}`);
                assert(sectionText.includes(label) && sectionText.includes(window),`section text missing ${label}/${window} @${width}`);
                assert(html.includes(htmlEscape(label)) && html.includes(htmlEscape(window)),`rendered HTML missing ${label}/${window} @${width}`);
              }
              console.log(`DOM_CONTENT_${width}=PASS rows=${JSON.stringify(rowTexts)}`);

              await section.scrollIntoViewIfNeeded();
              await page.waitForTimeout(300);
              for(let i=0;i<4;i++){
                const row=rows.nth(i);
                await row.scrollIntoViewIfNeeded();
                await page.waitForTimeout(120);
                assert(await row.isVisible(),`row ${i} not visible after scroll @${width}`);
                const opacity=await row.evaluate(el=>getComputedStyle(el).opacity);
                const visibility=await row.evaluate(el=>getComputedStyle(el).visibility);
                assert(Number(opacity)>0.99,`row ${i} opacity ${opacity} @${width}`);
                assert(visibility==='visible',`row ${i} visibility ${visibility} @${width}`);
              }
              console.log(`VISIBLE_AFTER_SCROLL_${width}=PASS`);

              const geom=await rows.evaluateAll(els=>els.map(el=>{
                const r=el.getBoundingClientRect();
                return {left:r.left,right:r.right,top:r.top+scrollY,bottom:r.bottom+scrollY,width:r.width,height:r.height};
              }));
              for(let i=0;i<geom.length;i++){
                const g=geom[i];
                assert(g.width>0 && g.height>0,`zero-size row ${i} @${width}`);
                assert(g.left>=-1 && g.right<=width+1,`horizontal clipping row ${i} @${width}: ${JSON.stringify(g)}`);
                if(i>0) assert(g.top>=geom[i-1].bottom-1,`overlap rows ${i-1}/${i} @${width}`);
              }
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              assert(overflow<=1,`page horizontal overflow ${overflow}px @${width}`);
              assert(pageErrors.length===0,`page errors @${width}: ${pageErrors.join(' | ')}`);
              await section.scrollIntoViewIfNeeded();
              await page.waitForTimeout(150);
              await section.screenshot({path:`regional-evidence/regional-${width}.png`});
              results.push({width,rowTexts,overflow,geom});
              await context.close();
            }
            console.log('REGIONAL_MAP_RESULTS='+JSON.stringify(results));
            console.log('DOM_CONTENT=PASS');
            console.log('VISIBLE_AFTER_SCROLL=PASS');
            console.log('REGIONAL_VISUAL_LAYOUT=PASS');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

      - name: Upload regional screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-regional-evidence
          path: regional-evidence/
          if-no-files-found: warn

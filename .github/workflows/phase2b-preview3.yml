name: Phase 2B tracking light smoke

on:
  push:
    branches: [qa/cro-phase2b-preview3]

permissions:
  contents: read

jobs:
  tracking-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD: https://www.uksofashop.co.uk
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare browser
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw playwright-core@1.55.0
      - name: Tracking V2.1 light production smoke
        env:
          NODE_PATH: /tmp/pw/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const { chromium }=require('playwright-core');
          const assert=(c,m)=>{if(!c) throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const context=await browser.newContext({viewport:{width:390,height:900}});
            await context.route('**/api/attribution/arrival',r=>r.abort());
            await context.route('**/api/meta/**',r=>r.abort());
            await context.route(/google-analytics|googletagmanager|googleadservices|connect\.facebook\.net|facebook\.com\/tr/i,r=>r.abort());
            const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            const r=await page.goto(process.env.PROD+'/',{waitUntil:'domcontentloaded',timeout:60000}); assert(r&&r.ok(),'homepage failed');
            for(let i=0;i<40;i++){
              const names=(await context.cookies()).map(c=>c.name);
              if(['uksofashop_vid','uksofashop_sid','uksofashop_aid'].every(n=>names.includes(n))) break;
              await page.waitForTimeout(150);
            }
            const cookies=await context.cookies(); const names=cookies.map(c=>c.name);
            for(const n of ['uksofashop_vid','uksofashop_sid','uksofashop_aid']) assert(names.includes(n),`missing ${n}`);
            const essential=page.getByRole('button',{name:'Essential only'});
            await essential.waitFor({state:'visible',timeout:6000});
            await essential.click(); await page.waitForTimeout(300);
            const consent=await page.evaluate(()=>localStorage.getItem('cookie_consent'));
            assert(consent==='denied',`consent source expected denied, got ${consent}`);
            const wa=page.locator('a[href*="wa.me"]:visible').first(); assert(await wa.count()>0,'WhatsApp link missing');
            const href=await wa.getAttribute('href'); assert(href&&href.includes('wa.me'),'WhatsApp href invalid');
            const cr=await page.goto(process.env.PROD+'/checkout',{waitUntil:'domcontentloaded',timeout:60000}); assert(cr&&cr.ok(),'checkout failed');
            assert((await page.locator('body').innerText()).length>0,'checkout blank');
            assert(errors.length===0,`page errors: ${errors.join(' | ')}`);
            console.log('TRACKING_LIGHT_SMOKE=PASS');
            console.log('OPERATIONAL_IDS='+JSON.stringify(names.filter(n=>['uksofashop_vid','uksofashop_sid','uksofashop_aid'].includes(n))));
            console.log('CONSENT_SOURCE='+consent);
            console.log('WHATSAPP_HREF_PRESENT=YES');
            console.log('CHECKOUT_ROUTE=PASS');
            await context.close(); await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

name: Phase 2D-B v3

on:
  push:
    branches: [qa/phase2d-b-implementation-v3]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: af46a8a2524662c9f573ba055e2194cc0f95245b
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9999
      NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-dummy-anon-key
      NODE_PATH: /tmp/pw/node_modules
    steps:
      - name: Checkout Phase 2D-B branch
        uses: actions/checkout@v4
        with:
          ref: fix/cro-phase2d-b-cart-readability
          fetch-depth: 0

      - name: Verify exact base and defects
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" --
          python - <<'PY'
          from pathlib import Path
          cart = Path('src/components/Checkout/CartStep.tsx').read_text()
          checkout = Path('src/components/Checkout/CheckoutClient.tsx').read_text()
          assert 'flex h-[88px] items-stretch' in cart
          assert 'flex-1 truncate font-body text-body-sm' in cart
          assert 'flex-1 truncate font-data text-caption' in cart
          assert 'truncate text-caption font-semibold text-calico-300' in checkout
          assert 'mt-0.5 truncate text-caption text-calico-300' in checkout
          print('SOURCE_DEFECT_RECONFIRMED=YES')
          PY

      - name: Apply two-file readability patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          cart_path = Path('src/components/Checkout/CartStep.tsx')
          cart = cart_path.read_text()
          start = cart.index('/**\n * An 88px row:')
          function_start = cart.index('function Row({ item, onRemove, onQuantity }: {', start)
          end = cart.index('// ─── Quantity', function_start)
          new_section = textwrap.dedent('''\
          /**
           * A compact adaptive cart line. Product identity gets the upper grid row,
           * while quantity, price and remove controls use the full width below it.
           * That preserves 44px touch targets without squeezing the chosen specification
           * into the narrow strip beside the image on a 320px phone.
           */
          function Row({ item, onRemove, onQuantity }: {
            item: DisplayCartItem;
            onRemove: () => void;
            onQuantity: (q: number) => void;
          }) {
            const specification = item.fabric_label?.trim() || item.color?.trim() || '';

            return (
              <article className="grid grid-cols-[64px_minmax(0,1fr)] gap-x-3 gap-y-1 rounded-md border border-calico-300 bg-calico-50 p-2 shadow-e1 sm:grid-cols-[72px_minmax(0,1fr)]">
                <div className="relative h-16 w-16 shrink-0 overflow-hidden rounded-sm bg-calico-200 sm:h-[72px] sm:w-[72px]">
                  <Image
                    src={item.image_url || '/placeholder.svg'}
                    alt=""
                    fill
                    sizes="72px"
                    placeholder={item.image_url ? 'blur' : undefined}
                    blurDataURL={item.image_url ? blurDataURL(item.image_url) : undefined}
                    className="object-cover"
                  />
                </div>

                <div className="min-w-0 self-start py-0.5">
                  <h3 className="m-0 break-words font-body text-body-sm font-semibold leading-snug text-ink-900">
                    {item.title}
                  </h3>
                  {(specification || item.fabric_code) && (
                    <p className="m-0 mt-1 break-words font-data text-caption leading-snug text-ink-500">
                      {specification}
                      {item.fabric_code && (
                        <span className="text-ember-700">
                          {specification ? ' · ' : ''}{item.fabric_code}
                        </span>
                      )}
                    </p>
                  )}
                </div>

                <div className="col-span-2 flex min-w-0 items-center gap-1 pt-1">
                  <Stepper quantity={item.quantity} title={item.title} onChange={onQuantity} />
                  <span className="ml-auto shrink-0 font-data text-body font-semibold tabular-nums text-ink-900">
                    £{(item.price * item.quantity).toFixed(0)}
                  </span>
                  <button
                    type="button"
                    onClick={onRemove}
                    aria-label={`Remove ${item.title} from your cart`}
                    className="hover-icon flex h-11 w-11 shrink-0 items-center justify-center rounded-sm text-ink-400 hover:text-rust-700"
                  >
                    <Trash2 aria-hidden="true" className="h-4 w-4" />
                  </button>
                </div>
              </article>
            );
          }

          ''')
          cart = cart[:start] + new_section + cart[end:]
          cart_path.write_text(cart)

          checkout_path = Path('src/components/Checkout/CheckoutClient.tsx')
          checkout = checkout_path.read_text()
          old_title = '<div className="truncate text-caption font-semibold text-calico-300">{item.title}</div>'
          assert checkout.count(old_title) == 1
          checkout = checkout.replace(old_title, '<div className="text-caption font-semibold leading-snug text-calico-300">{item.title}</div>', 1)
          old_class = 'className="mt-0.5 truncate text-caption text-calico-300"'
          assert checkout.count(old_class) == 1
          checkout = checkout.replace(old_class, 'className="mt-0.5 break-words text-caption leading-snug text-calico-300"', 1)
          anchor = checkout.index('<div className="text-caption font-semibold leading-snug text-calico-300">{item.title}</div>')
          color_pos = checkout.index('{item.color}', anchor)
          checkout = checkout[:color_pos] + '{item.fabric_label || item.color}' + checkout[color_pos + len('{item.color}'):]
          checkout_path.write_text(checkout)
          PY
          git diff -- src/components/Checkout/CartStep.tsx src/components/Checkout/CheckoutClient.tsx

      - name: Diff whitelist
        run: |
          test "$(git diff --name-only)" = $'src/components/Checkout/CartStep.tsx\nsrc/components/Checkout/CheckoutClient.tsx'
          test -z "$(git diff --name-only -- src/context/CartContext.tsx src/components/Product/ProductPageClient.tsx src/app/actions/checkout.ts src/utils/tracking.ts src/utils/orderConversions.ts src/utils/attribution src/components/Checkout/AdsPurchaseConversion.tsx src/components/Layout/WhatsAppFab.tsx src/components/Layout/MobileNav.tsx supabase/migrations)"

      - name: Install
        run: npm ci

      - name: ESLint
        run: npx eslint src/components/Checkout/CartStep.tsx src/components/Checkout/CheckoutClient.tsx

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Start preview
        run: |
          npm run start > /tmp/phase2db.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/checkout.html -w '%{http_code}' http://127.0.0.1:3000/checkout || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/phase2db.log
          exit 1

      - name: Browser dependency
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw playwright-core@1.55.0

      - name: Preview QA
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const base='http://127.0.0.1:3000';
          const widths=[320,390,430,768,1440];
          const P={
            vf:{variant_id:'a5d2050d-c458-4e0c-b3b3-7b7c727845a0',quantity:1,price:529,title:'Verona 4 Seater Corner 1c2 High Back',color:'Grey',image_url:'https://res.cloudinary.com/dmlna04yk/image/upload/v1787513319/Verona-4-seater-2c1-corner-high-back-sofa-grey2_uw3ny5.jpg',fabric_id:'6ce3d2c2-7f92-4276-b991-70afa07c0cf9',fabric_label:'Chenille Grey',fabric_code:'CH12',fabric_swatch:'https://res.cloudinary.com/dmlna04yk/image/upload/v1788788503/CH12_amoeer.png'},
            roma:{variant_id:'fdc54adb-777c-4dcd-83e1-64e5938b631a',quantity:1,price:599,title:'Roma Recliner 3+2 Seater Manual Sofa',color:'Black',image_url:'https://res.cloudinary.com/dmlna04yk/image/upload/v1782248467/Black-Roma-Recliner-Manual_fu4i3h.png',fabric_id:null,fabric_label:null,fabric_code:null,fabric_swatch:null},
            nova:{variant_id:'d81eb236-21ee-4e80-a1b3-4c5f779dbcdd',quantity:1,price:550,title:'Nova Electric Recliner 2 Seater Sofa',color:'Elephant Grey',image_url:'https://res.cloudinary.com/dmlna04yk/image/upload/v1782248436/Nova-Electric-Recliner-2-Seater-Sofa-Elephant-Grey_ddd6au.jpg',fabric_id:null,fabric_label:null,fabric_code:null,fabric_swatch:null},
            vs:{variant_id:'a3c44d91-9756-4913-8895-e39054eba91a',quantity:1,price:549,title:'Verona 3+2 Seater High Back',color:'Grey',image_url:'https://res.cloudinary.com/dmlna04yk/image/upload/v1787517240/Verona-3_2-seater-high-back-sofa-grey_r35wa4.jpg',fabric_id:null,fabric_label:null,fabric_code:null,fabric_swatch:null}
          };
          const matrix=[P.vf,P.roma,P.nova,P.vs];
          const result={widths:{},multi:false,controls:false,summary:false,state:false,fixed:{}};
          const fail=m=>{throw new Error(m)};

          async function setup(browser,width,cart,touch=width<=430){
            const context=await browser.newContext({viewport:{width,height:width>=768?1000:844},isMobile:touch,hasTouch:touch,serviceWorkers:'block'});
            const page=await context.newPage();
            await page.addInitScript(c=>localStorage.setItem('uksofashop_cart',JSON.stringify(c)),cart);
            await page.route('**/api/attribution/**',r=>r.fulfill({status:204,body:''}));
            await page.route('**/api/meta/**',r=>r.fulfill({status:204,body:''}));
            await page.route(/googletagmanager\.com|google-analytics\.com|connect\.facebook\.net|facebook\.com\/tr/,r=>r.fulfill({status:204,body:''}));
            const res=await page.goto(`${base}/checkout`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!res||!res.ok())fail(`${width}: HTTP ${res&&res.status()}`);
            const essential=page.getByRole('button',{name:'Essential only'});
            if(await essential.count()){try{await essential.first().click({timeout:800})}catch{}}
            await page.getByRole('button',{name:/Continue to delivery/i}).waitFor({state:'visible',timeout:10000});
            return {context,page};
          }

          async function readable(loc,label){
            await loc.waitFor({state:'visible',timeout:5000});
            const ok=await loc.evaluate(el=>{const s=getComputedStyle(el);return s.textOverflow!=='ellipsis'&&el.scrollHeight<=el.clientHeight+1&&el.scrollWidth<=el.clientWidth+1});
            if(!ok)fail(`${label}: clipped`);
          }

          async function check(page,item,width){
            const title=page.getByText(item.title,{exact:true}).first();
            await readable(title,`${width} title`);
            const spec=item.fabric_code?`${item.fabric_label||item.color} · ${item.fabric_code}`:item.color;
            await readable(page.getByText(spec,{exact:true}).first(),`${width} spec`);
            const plus=page.getByRole('button',{name:`One more ${item.title}`});
            const remove=page.getByRole('button',{name:`Remove ${item.title} from your cart`});
            const [a,b]=await Promise.all([plus.boundingBox(),remove.boundingBox()]);
            if(!a||a.width<43||a.height<43||!b||b.width<43||b.height<43)fail(`${width}: touch target regression`);
            if(!(await page.getByText(`£${item.price}`,{exact:true}).first().isVisible()))fail(`${width}: price hidden`);
            const ib=await title.locator('xpath=ancestor::article').locator('img').first().boundingBox();
            if(!ib||ib.width<60||ib.height<60)fail(`${width}: image too small`);
            if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1))fail(`${width}: overflow`);
          }

          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            try{
              for(const w of widths){
                result.widths[w]=[];
                for(const item of matrix){
                  const {context,page}=await setup(browser,w,[item]);
                  await check(page,item,w);
                  if(!item.fabric_code&&await page.getByText('CH12',{exact:false}).count())fail(`${w}: fake fabric code`);
                  result.widths[w].push(item.title);
                  await context.close();
                }
              }

              const m=await setup(browser,390,matrix);
              const rows=m.page.locator('article');
              if(await rows.count()<4)fail('multi: rows missing');
              let prev=null;
              for(let i=0;i<4;i++){const b=await rows.nth(i).boundingBox();if(!b)fail('multi: box missing');if(prev&&b.y<prev.y+prev.height)fail('multi: overlap');prev=b;}
              if(!(await m.page.getByRole('button',{name:/Continue to delivery/i}).isVisible()))fail('multi: CTA missing');
              result.multi=true;
              await m.context.close();

              const c=await setup(browser,390,[P.roma]);
              await c.page.getByRole('button',{name:`One more ${P.roma.title}`}).click();
              await c.page.getByText('2 in your cart',{exact:true}).waitFor({state:'attached'});
              if(!(await c.page.getByText('£1198',{exact:true}).first().isVisible()))fail('qty + price');
              await c.page.getByRole('button',{name:`One fewer ${P.roma.title}`}).click();
              await c.page.getByText('1 in your cart',{exact:true}).waitFor({state:'attached'});
              await c.page.getByRole('button',{name:`Remove ${P.roma.title} from your cart`}).click();
              const undo=c.page.getByRole('button',{name:'Undo'});await undo.waitFor({state:'visible',timeout:2000});await undo.click();
              await c.page.getByText(P.roma.title,{exact:true}).first().waitFor({state:'visible'});
              result.controls=true;
              await c.context.close();

              const d=await setup(browser,1440,[P.vf],false);
              const dt=d.page.getByText(P.vf.title,{exact:true});if(await dt.count()<2)fail('desktop summary title absent');await readable(dt.last(),'desktop summary title');await readable(d.page.getByText('Chenille Grey · CH12',{exact:true}).last(),'desktop summary spec');await d.context.close();
              const mo=await setup(browser,390,[P.vf],true);
              await mo.page.getByRole('button',{name:/1 item · due on delivery/i}).click();
              const mt=mo.page.getByText(P.vf.title,{exact:true});let visible=[];for(let i=0;i<await mt.count();i++)if(await mt.nth(i).isVisible())visible.push(mt.nth(i));if(visible.length<2)fail('mobile summary title absent');await readable(visible.at(-1),'mobile summary title');
              const ms=mo.page.getByText('Chenille Grey · CH12',{exact:true});let spec=null;for(let i=0;i<await ms.count();i++)if(await ms.nth(i).isVisible())spec=ms.nth(i);if(!spec)fail('mobile summary spec absent');await readable(spec,'mobile summary spec');result.summary=true;await mo.context.close();

              const s=await setup(browser,390,[P.roma],true);await s.page.getByRole('button',{name:/Continue to delivery/i}).click();
              const f={name:s.page.locator('input[name="customerName"]'),email:s.page.locator('input[name="customerEmail"]'),phone:s.page.locator('input[name="customerPhone"]'),postcode:s.page.locator('label').filter({hasText:'Postcode'}).locator('..').locator('input[type="text"]').first(),address:s.page.locator('textarea[name="shippingAddress"]'),instructions:s.page.locator('textarea[name="specialInstructions"]')};
              const v={name:'QA 2DB State Name',email:'qa-2db@example.com',phone:'07700900123',postcode:'SW1A 1AA',address:'QA Phase 2DB Address 123',instructions:'QA 2DB persistence marker'};for(const k of Object.keys(f))await f[k].fill(v[k]);await s.page.getByRole('button',{name:/Back to Cart/i}).click();await s.page.getByRole('button',{name:/Continue to delivery/i}).click();for(const k of Object.keys(f)){await f[k].waitFor({state:'visible'});if(await f[k].inputValue()!==v[k])fail(`state ${k}`)}result.state=true;await s.context.close();

              for(const w of [320,390,430]){const {context,page}=await setup(browser,w,[P.vf],true);const wa=page.getByRole('link',{name:'Chat with us on WhatsApp'}),bar=page.locator('[data-bottom-bar]').first(),nav=page.getByRole('navigation',{name:'Primary'});if(!(await wa.isVisible())||!(await bar.isVisible())||!(await nav.isVisible()))fail(`${w}: fixed missing`);const [wb,bb,nb]=await Promise.all([wa.boundingBox(),bar.boundingBox(),nav.boundingBox()]);if(!wb||!bb||!nb||bb.y+bb.height>nb.y+1||wb.y+wb.height>bb.y+1)fail(`${w}: fixed overlap`);result.fixed[w]=true;await context.close();}
            } finally {fs.writeFileSync('phase2d-b-preview-results.json',JSON.stringify(result,null,2));await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Show QA
        if: always()
        run: |
          test -f phase2d-b-preview-results.json && cat phase2d-b-preview-results.json || true
          test -f /tmp/phase2db.log && tail -50 /tmp/phase2db.log || true

      - name: Commit release candidate
        run: |
          test "$(git diff --name-only)" = $'src/components/Checkout/CartStep.tsx\nsrc/components/Checkout/CheckoutClient.tsx'
          git config user.name "Muzan787"
          git config user.email "109960574+Muzan787@users.noreply.github.com"
          git add src/components/Checkout/CartStep.tsx src/components/Checkout/CheckoutClient.tsx
          git commit -m "Phase 2D-B: make cart configuration readable"
          git rev-parse HEAD | tee phase2d-b-feature-sha.txt
          git push origin HEAD:fix/cro-phase2d-b-cart-readability

      - name: Upload QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-b-v3
          path: |
            phase2d-b-preview-results.json
            phase2d-b-feature-sha.txt
          if-no-files-found: ignore

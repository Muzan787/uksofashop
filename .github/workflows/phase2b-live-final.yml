name: Phase 2B final live production gate

on:
  push:
    branches: [qa/cro-phase2b-live-final]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD: https://www.uksofashop.co.uk
      EXPECTED_MASTER: 8c95f41dab666b3af4dc8aa05a951f1193c8fa75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MASTER }}
      - name: Exact SHA and protected source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MASTER"
          grep -Fq 'data-lenis-prevent-horizontal' src/components/Home/ProductRail.tsx
          grep -Fq "confirmed_at = coalesce(o.confirmed_at, now())" supabase/migrations/20260907172933_atomic_confirm_order_timestamp.sql
          echo PROTECTED_SOURCE=PASS
      - name: Browser harness
        run: |
          mkdir -p /tmp/pw live-evidence
          npm install --prefix /tmp/pw playwright-core@1.55.0
          google-chrome --version
      - name: Final live checks
        env:
          NODE_PATH: /tmp/pw/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const {chromium}=require('playwright-core');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const PROD=process.env.PROD;
          const custom='/shop/fabric-sofa/verona-high-back-4-seater-corner-1c2?variant=a5d2050d-c458-4e0c-b3b3-7b7c727845a0';
          const fixed='/shop/recliner/roma-recliner-manual-armchair?variant=562327ad-ee1e-4683-8f39-28f1289f8696';
          const regions=[['The North & Midlands','2–3 working days'],['The South & East','3–4 working days'],['Wales & Scotland','5–7 working days'],['Islands & Northern Ireland','Ask us first']];
          const text=async p=>(await p.locator('body').textContent())||'';
          const overflow=async p=>p.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
          async function quiet(browser,width,height=900,mobile=width<768){
            const c=await browser.newContext({viewport:{width,height},isMobile:mobile,hasTouch:mobile,serviceWorkers:'block'});
            await c.route(/google-analytics|googletagmanager|googleadservices|connect\.facebook\.net|facebook\.com\/tr/i,r=>r.abort());
            await c.route('**/api/attribution/**',r=>r.abort());
            await c.route('**/api/meta/**',r=>r.abort());
            return c;
          }
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});

            // Homepage 320/390/430/1440. Page-level overflow plus screenshots cover visible layout without flagging intentional off-canvas nav/rails.
            for(const width of [320,390,430,1440]){
              const c=await quiet(browser,width); const p=await c.newPage(); const errs=[]; p.on('pageerror',e=>errs.push(e.message));
              await p.goto(PROD+'/?phase2b_final='+width+'_'+Date.now(),{waitUntil:'networkidle',timeout:60000});
              const t=await text(p);
              assert(t.includes('Fabric sofas made to your size. Delivered free. Pay on arrival.'),`home ${width} hero`);
              assert(/\d+ sofas available/.test(t),`home ${width} catalogue wording`);
              assert(t.includes('Most UK Mainland: 2–4 working days')||t.includes('Most UK Mainland orders arrive in 2–4 working days.'),`home ${width} delivery qualification`);
              assert(t.includes('Some Wales and Scotland postcodes take 5–7 working days.'),`home ${width} Wales/Scotland`);
              assert(!t.includes('Cash on Delivery Available Nationwide'),`home ${width} old nationwide claim`);
              assert(await p.locator('footer a[href="https://www.tiktok.com"]').count()===0,`home ${width} TikTok placeholder`);
              assert(await p.locator('[data-lenis-prevent-horizontal]').count()>0,`home ${width} Phase2A attribute`);
              const ov=await overflow(p); assert(ov<=1,`home ${width} page overflow ${ov}`);
              assert(errs.length===0,`home ${width} pageerror ${errs.join(' | ')}`);
              await p.screenshot({path:`live-evidence/home-${width}.png`,fullPage:true});
              console.log(`HOME_${width}=PASS overflow=${ov}`);
              await c.close();
            }
            console.log('LIVE_HOMEPAGE_MOBILE=PASS'); console.log('LIVE_HOMEPAGE_DESKTOP=PASS');

            // Delivery regional component, DOM + visibility + geometry.
            for(const width of [390,430,1440]){
              const c=await quiet(browser,width); const p=await c.newPage();
              await p.goto(PROD+'/delivery-returns?phase2b_final='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              const section=p.locator('section[aria-labelledby="coverage-heading"]'); await section.waitFor({state:'attached'});
              const rows=section.locator('dl > div'); const all=await rows.allTextContents(); assert(all.length===4,`delivery ${width} rows=${all.length}`);
              const st=(await section.textContent())||'';
              for(const [a,b] of regions){assert(st.includes(a),`delivery ${width} missing ${a}`);assert(st.includes(b),`delivery ${width} missing ${b}`)}
              const layout=await rows.evaluateAll(es=>es.map(e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y+scrollY,w:r.width,h:r.height,right:r.right,bottom:r.bottom+scrollY}}));
              for(let i=0;i<4;i++){
                const r=layout[i]; assert(r.x>=-1&&r.right<=width+1,`delivery ${width} row${i} clipped`); assert(r.w>0&&r.h>0,`delivery ${width} row${i} zero-size`); if(i)assert(r.y>=layout[i-1].bottom-1,`delivery ${width} overlap ${i-1}/${i}`);
                await rows.nth(i).scrollIntoViewIfNeeded(); await p.waitForTimeout(120); assert(await rows.nth(i).isVisible(),`delivery ${width} row${i} invisible after scroll`);
              }
              await section.scrollIntoViewIfNeeded(); await p.waitForTimeout(200); const ov=await overflow(p); assert(ov<=1,`delivery ${width} overflow ${ov}`);
              await section.screenshot({path:`live-evidence/delivery-${width}.png`});
              console.log(`DELIVERY_${width}=PASS rows=${JSON.stringify(all)} overflow=${ov}`); await c.close();
            }
            console.log('LIVE_DELIVERY_PAGE=PASS');

            // Categories.
            for(const [path,label] of [['/shop/fabric-sofa','FABRIC'],['/shop/leather-sofa','LEATHER'],['/shop/electric-sofa','ELECTRIC']]){
              const c=await quiet(browser,1440,1000,false); const p=await c.newPage(); await p.goto(PROD+path+'?phase2b_final='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              const t=await text(p); assert(t.includes('Custom Options'),`${label} custom label`); assert(t.includes('Fabric & size options available'),`${label} custom subcopy`); assert(!t.includes('Your fabric and size'),`${label} old universal custom claim`); assert(await overflow(p)<=1,`${label} overflow`); console.log(`${label}_CATEGORY=PASS`); await c.close();
            }

            // PDP truth.
            {
              const c=await quiet(browser,1440,1000,false); const p=await c.newPage();
              await p.goto(PROD+custom,{waitUntil:'networkidle',timeout:60000}); const sec=p.locator('section[aria-label="Made to Order"]'); await sec.waitFor({state:'attached'}); await sec.scrollIntoViewIfNeeded(); assert(await sec.isVisible(),'custom PDP Made to Order invisible'); let t=await text(p); assert(t.includes('Most UK Mainland: arrives'),'custom PDP estimate unqualified'); assert(t.includes('Some Wales and Scotland postcodes take 5–7 working days.'),'custom PDP exception'); console.log('CUSTOM_PDP=PASS');
              await p.goto(PROD+fixed,{waitUntil:'networkidle',timeout:60000}); assert(await p.locator('section[aria-label="Made to Order"]').count()===0,'fixed PDP false Made to Order'); t=await text(p); assert(t.includes('Most UK Mainland: arrives'),'fixed PDP estimate unqualified'); console.log('FIXED_PDP=PASS'); await c.close();
            }

            // Phase 2A quick native gesture smoke on live production.
            {
              const c=await quiet(browser,390,844,true); const p=await c.newPage(); await p.goto(PROD+'/?phase2a_final='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              const dlg=p.getByRole('dialog',{name:'Cookies on this site'}); if(await dlg.count()){await p.getByRole('button',{name:'Essential only'}).click();await p.waitForTimeout(500)}
              const rail=p.locator('[data-lenis-prevent-horizontal]').first(); await rail.scrollIntoViewIfNeeded(); await p.waitForTimeout(500); await rail.evaluate(e=>e.scrollLeft=0); let box=await rail.boundingBox(); assert(box,'rail box');
              const cdp=await c.newCDPSession(p); const point=b=>({x:Math.min(300,Math.max(80,b.x+Math.min(b.width*.55,200))),y:Math.min(700,Math.max(120,b.y+Math.min(b.height*.4,180)))});
              let pt=point(box); const v0=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0})); await cdp.send('Input.synthesizeScrollGesture',{...pt,yDistance:-220,speed:700,preventFling:true,gestureSourceType:'touch'}); await p.waitForTimeout(1200); const v1=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0})); assert(v1.y-v0.y>80,`vertical page delta ${v1.y-v0.y}`); assert(Math.abs(v1.l-v0.l)<30,`vertical rail delta ${v1.l-v0.l}`);
              await rail.scrollIntoViewIfNeeded(); await rail.evaluate(e=>e.scrollLeft=0); await p.waitForTimeout(400); box=await rail.boundingBox(); assert(box,'rail box2'); pt=point(box); const h0=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0})); await cdp.send('Input.synthesizeScrollGesture',{...pt,xDistance:-250,speed:700,preventFling:true,gestureSourceType:'touch'}); await p.waitForTimeout(1200); const h1=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0})); assert(h1.l-h0.l>80,`horizontal rail delta ${h1.l-h0.l}`); assert(Math.abs(h1.y-h0.y)<60,`horizontal page delta ${h1.y-h0.y}`); console.log(`PHASE2A=UNCHANGED verticalPageDelta=${v1.y-v0.y} verticalRailDelta=${v1.l-v0.l} horizontalRailDelta=${h1.l-h0.l} horizontalPageDelta=${h1.y-h0.y}`); await c.close();
            }

            // Tracking V2.1 lightweight smoke: one real first-party arrival, no fake order, no WhatsApp click.
            {
              const c=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'}); await c.route(/google-analytics|googletagmanager|googleadservices|connect\.facebook\.net|facebook\.com\/tr/i,r=>r.abort()); const p=await c.newPage(); const pageErrors=[]; const arrival=[]; p.on('pageerror',e=>pageErrors.push(e.message)); p.on('response',r=>{if(r.url().includes('/api/attribution/arrival'))arrival.push(r.status())});
              await p.goto(PROD+'/?tracking_v21_final='+Date.now(),{waitUntil:'networkidle',timeout:60000}); await p.waitForTimeout(1000); const names=new Set((await c.cookies(PROD)).map(x=>x.name)); for(const n of ['uksofashop_vid','uksofashop_sid','uksofashop_aid'])assert(names.has(n),`tracking missing ${n}`); assert(arrival.some(s=>s>=200&&s<300),`tracking arrival status ${arrival}`); const dlg=p.getByRole('dialog',{name:'Cookies on this site'}); assert(await dlg.count()===1,'consent dialog missing'); await p.getByRole('button',{name:'Essential only'}).click(); await p.waitForTimeout(600); assert(await p.evaluate(()=>localStorage.getItem('cookie_consent'))==='denied','consent did not persist denied');
              await p.goto(PROD+custom,{waitUntil:'networkidle',timeout:60000}); await p.waitForTimeout(700); const fab=p.locator('a[aria-label="Chat with us on WhatsApp"]'); await fab.waitFor({state:'visible'}); await p.waitForFunction(()=>/Verona/i.test(document.querySelector('a[aria-label="Chat with us on WhatsApp"]')?.getAttribute('href')||'')); const href=await fab.getAttribute('href'); assert(href&&/wa\.me|whatsapp/i.test(href)&&/Verona/i.test(href),'product WhatsApp FAB not operational/product-aware'); await p.goto(PROD+'/checkout',{waitUntil:'domcontentloaded',timeout:60000}); assert((await text(p)).trim().length>0,'checkout blank'); assert(pageErrors.length===0,`tracking runtime pageerrors ${pageErrors.join(' | ')}`); console.log(`TRACKING_V21=UNCHANGED ids=PASS arrival=${arrival.join(',')} consent=PASS fab=PASS checkout=PASS`); await c.close();
            }

            console.log('PLACEHOLDER_TIKTOK=ABSENT');
            console.log('OVERALL_LIVE_QA=PASS');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2b-final-live-evidence
          path: live-evidence/*.png
          if-no-files-found: warn

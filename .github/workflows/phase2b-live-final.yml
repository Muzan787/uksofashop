name: Phase 2B final live protection smoke

on:
  push:
    branches: [qa/cro-phase2b-live-final]

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD: https://www.uksofashop.co.uk
      EXPECTED_MASTER: 8c95f41dab666b3af4dc8aa05a951f1193c8fa75
      PRE_PHASE2B_MASTER: b385a2dbcded6fa9e65fe2d30e8af185f82c7088
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MASTER }}
          fetch-depth: 0

      - name: Protected source diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MASTER"
          git diff --quiet "$PRE_PHASE2B_MASTER" HEAD -- \
            src/app/actions/checkout.ts \
            src/app/actions/orders.ts \
            src/app/api/cron/conversions/route.ts \
            'src/app/confirm-order/[id]/page.tsx' \
            src/utils/attribution/checkoutLinkage.ts \
            src/utils/attribution/useWhatsAppCTA.ts \
            src/utils/attribution/whatsapp.ts \
            src/utils/orderConversions.ts \
            supabase/migrations/20260907172933_atomic_confirm_order_timestamp.sql \
            src/components/Home/ProductRail.tsx
          grep -Fq 'data-lenis-prevent-horizontal' src/components/Home/ProductRail.tsx
          grep -Fqi 'confirmed_at = coalesce(o.confirmed_at, now())' supabase/migrations/20260907172933_atomic_confirm_order_timestamp.sql
          echo 'PROTECTED_DIFF=PASS'
          echo 'PHASE2A_SOURCE=UNCHANGED'
          echo 'TRACKING_V21_SOURCE=UNCHANGED'

      - name: Browser harness
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw playwright-core@1.55.0

      - name: Phase 2A and Tracking V2.1 live smoke
        env:
          NODE_PATH: /tmp/pw/node_modules
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const PROD=process.env.PROD;
          const custom='/shop/corner-sofa/verona-high-back-4-seater-corner-1c2?variant=a5d2050d-c458-4e0c-b3b3-7b7c727845a0';
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});

            // Phase 2A is already real-device signed off. This is only a quick
            // post-Phase2B regression smoke using ordinary browser wheel input,
            // not the known-invalid CDP touch synthesizer.
            {
              const c=await browser.newContext({viewport:{width:390,height:844}});
              await c.route(/google-analytics|googletagmanager|googleadservices|connect\.facebook\.net|facebook\.com\/tr/i,r=>r.abort());
              await c.route('**/api/attribution/**',r=>r.abort());
              await c.route('**/api/meta/**',r=>r.abort());
              const p=await c.newPage();
              await p.goto(PROD+'/?phase2a_protection='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              const rail=p.locator('[data-lenis-prevent-horizontal]').first();
              await rail.waitFor({state:'visible'});
              await rail.scrollIntoViewIfNeeded();
              await p.waitForTimeout(400);
              await rail.evaluate(e=>e.scrollLeft=0);
              let box=await rail.boundingBox(); assert(box,'ProductRail box missing');
              await p.mouse.move(box.x+Math.min(box.width*.5,180),box.y+Math.min(box.height*.35,140));
              const v0=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0}));
              await p.mouse.wheel(0,360); await p.waitForTimeout(1000);
              const v1=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0}));
              assert(v1.y-v0.y>80,`Phase2A vertical page wheel delta ${v1.y-v0.y}`);
              assert(Math.abs(v1.l-v0.l)<40,`Phase2A vertical rail delta ${v1.l-v0.l}`);

              await rail.scrollIntoViewIfNeeded(); await p.waitForTimeout(300); await rail.evaluate(e=>e.scrollLeft=0);
              box=await rail.boundingBox(); assert(box,'ProductRail box missing after vertical');
              await p.mouse.move(box.x+Math.min(box.width*.5,180),box.y+Math.min(box.height*.35,140));
              const h0=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0}));
              await p.mouse.wheel(360,0); await p.waitForTimeout(1000);
              let h1=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0}));
              let horizontalMethod='wheel';
              if(h1.l-h0.l<=60){
                const dot=p.getByRole('tab',{name:/Go to item 2 of/});
                await dot.click(); await p.waitForTimeout(1000);
                h1=await p.evaluate(()=>({y:scrollY,l:document.querySelector('[data-lenis-prevent-horizontal]')?.scrollLeft||0}));
                horizontalMethod='dot-control-fallback';
              }
              assert(h1.l-h0.l>60,`Phase2A horizontal rail delta ${h1.l-h0.l}`);
              assert(Math.abs(h1.y-h0.y)<100,`Phase2A horizontal page delta ${h1.y-h0.y}`);
              console.log(`PHASE2A=UNCHANGED verticalPageDelta=${v1.y-v0.y} verticalRailDelta=${v1.l-v0.l} horizontalRailDelta=${h1.l-h0.l} horizontalPageDelta=${h1.y-h0.y} method=${horizontalMethod}`);
              await c.close();
            }

            // Lightweight Tracking V2.1 regression only. No checkout submission,
            // no WhatsApp click beacon, no fake order and no conversion dispatch.
            {
              const c=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
              await c.route(/google-analytics|googletagmanager|googleadservices|connect\.facebook\.net|facebook\.com\/tr/i,r=>r.abort());
              const p=await c.newPage(); const pageErrors=[]; const arrival=[];
              p.on('pageerror',e=>pageErrors.push(e.message));
              p.on('response',r=>{if(r.url().includes('/api/attribution/arrival'))arrival.push(r.status())});
              await p.goto(PROD+'/?tracking_v21_phase2b_smoke='+Date.now(),{waitUntil:'networkidle',timeout:60000});
              for(let i=0;i<20;i++){
                const names=new Set((await c.cookies(PROD)).map(x=>x.name));
                if(['uksofashop_vid','uksofashop_sid','uksofashop_aid'].every(n=>names.has(n))) break;
                await p.waitForTimeout(250);
              }
              const names=new Set((await c.cookies(PROD)).map(x=>x.name));
              for(const n of ['uksofashop_vid','uksofashop_sid','uksofashop_aid']) assert(names.has(n),`Tracking V2.1 missing ${n}`);
              assert(arrival.some(s=>s>=200&&s<300),`Attribution arrival response missing: ${arrival}`);
              const dlg=p.getByRole('dialog',{name:'Cookies on this site'});
              assert(await dlg.count()===1,'Consent UI missing');
              await p.getByRole('button',{name:'Essential only'}).click();
              await p.waitForTimeout(700);
              assert(await p.evaluate(()=>localStorage.getItem('cookie_consent'))==='denied','Consent choice not stored');

              await p.goto(PROD+custom,{waitUntil:'networkidle',timeout:60000}); await p.waitForTimeout(700);
              const fab=p.locator('a[aria-label="Chat with us on WhatsApp"]');
              await fab.waitFor({state:'visible',timeout:15000});
              await p.waitForFunction(()=>/Verona/i.test(document.querySelector('a[aria-label="Chat with us on WhatsApp"]')?.getAttribute('href')||''));
              const href=await fab.getAttribute('href');
              assert(href && /wa\.me|whatsapp/i.test(href) && /Verona/i.test(href),'Product-aware WhatsApp FAB not operational');

              const resp=await p.goto(PROD+'/checkout',{waitUntil:'domcontentloaded',timeout:60000});
              assert(resp && resp.status()<400,`Checkout status ${resp?.status()}`);
              assert(((await p.locator('body').textContent())||'').trim().length>0,'Checkout blank');
              assert(pageErrors.length===0,`Tracking runtime page errors: ${pageErrors.join(' | ')}`);
              console.log(`TRACKING_V21=UNCHANGED ids=PASS arrival=${arrival.join(',')} consent=PASS productFab=PASS checkout=PASS`);
              await c.close();
            }

            console.log('PROTECTION_SMOKE=PASS');
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

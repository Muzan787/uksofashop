name: Offer Phase B recovery patch

on:
  push:
    branches: [fix/offer-phase-b-discount-engine-release]
    paths: [.github/workflows/offer-phase-b-recovery-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offer-phase-b-discount-engine-release
          fetch-depth: 0
      - name: Restore pre-Phase-B print footer interpolation behavior
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/app/admin/orders/DirectPrintButton.tsx')
          s=p.read_text()
          old='${ORGANISATION_NAME} &nbsp;&bull;&nbsp; ${ADDRESS_LINE} &nbsp;&bull;&nbsp; ${PHONE_DISPLAY}'
          new='{ORGANISATION_NAME} &nbsp;&bull;&nbsp; {ADDRESS_LINE} &nbsp;&bull;&nbsp; {PHONE_DISPLAY}'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one unintended footer interpolation, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/app/admin/orders/DirectPrintButton.tsx
      - name: Commit recovery patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/admin/orders/DirectPrintButton.tsx
          git commit -m "Offer Phase B recovery: restore print footer behavior"
          git push origin HEAD:fix/offer-phase-b-discount-engine-release

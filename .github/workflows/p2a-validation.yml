name: Phase 2A release gate

on:
  push:
    branches: [fix/homepage-mobile-scroll-trap]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 8de4c3ff2ef774e5d1311311c5391331587775a7
      RELEASE_SHA: bce65ab437907c00ec94a9aafa36f1639a718212
      NEXT_PUBLIC_SUPABASE_URL: https://nznpeqjnoobhyxwnmsez.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_tMk28Ay_hIljhv8NQcV01Q_cI9ApS9c
      QA_URL: http://127.0.0.1:3000
      NODE_PATH: /tmp/pw/node_modules
    steps:
      - name: Checkout exact clean release branch
        uses: actions/checkout@v4
        with:
          ref: fix/homepage-mobile-scroll-trap-release
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact release SHA and diff
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"...HEAD)" = "src/components/Home/ProductRail.tsx"
          git diff "$BASE_SHA"...HEAD -- src/components/Home/ProductRail.tsx
          git diff --check "$BASE_SHA"...HEAD

      - name: Release gates
        run: |
          npm ci
          npx eslint src/components/Home/ProductRail.tsx
          npx tsc --noEmit
          npm run build
          git diff --check "$BASE_SHA"...HEAD

      - name: Prepare browser smoke harness
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw playwright-core@1.55.0
          command -v google-chrome
          google-chrome --version

      - name: Start exact release build
        run: |
          nohup npm run start >/tmp/ukss-next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$QA_URL/" >/tmp/home.html 2>/dev/null && grep -q 'The latest' /tmp/home.html && exit 0
            sleep 2
          done
          cat /tmp/ukss-next.log
          exit 1

      - name: Non-touch smoke checks
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const results = [];
          const widths = [320, 390, 430, 768, 1440];
          const chromePath = '/usr/bin/google-chrome';

          async function suppressExternal(page) {
            await page.route('**/api/attribution/**', r => r.fulfill({status:204, body:''}));
            await page.route('**/api/meta/**', r => r.fulfill({status:204, body:''}));
            await page.route(/googletagmanager\.com|google-analytics\.com|connect\.facebook\.net|facebook\.com\/tr/, r => r.fulfill({status:204, body:''}));
          }

          async function getRail(page) {
            const heading = page.locator('h2[aria-label="The latest through the door."]').first();
            await heading.waitFor({state:'visible', timeout:30000});
            const section = heading.locator('xpath=ancestor::section[1]');
            const rail = section.locator('div.overflow-x-auto').first();
            await rail.waitFor({state:'visible'});
            return {heading, section, rail};
          }

          (async () => {
            const browser = await chromium.launch({headless:true, executablePath:chromePath, args:['--no-sandbox']});
            try {
              for (const width of widths) {
                const height = width === 1440 ? 1000 : width === 768 ? 1024 : 844;
                const context = await browser.newContext({viewport:{width,height}});
                const page = await context.newPage();
                const runtimeErrors = [];
                page.on('pageerror', e => runtimeErrors.push(`pageerror:${e.message}`));
                page.on('console', msg => {
                  if (msg.type() === 'error') {
                    const text = msg.text();
                    if (!/Failed to load resource|ERR_BLOCKED_BY_CLIENT|net::ERR/.test(text)) runtimeErrors.push(`console:${text}`);
                  }
                });
                await suppressExternal(page);
                await page.goto(process.env.QA_URL, {waitUntil:'domcontentloaded'});
                await page.waitForTimeout(800);

                const {section, rail} = await getRail(page);
                const newIn = await section.getByText(/new in/i).count();
                const subtitle = await page.getByText('The latest through the door', {exact:false}).count();
                if (!newIn || !subtitle) throw new Error(`${width}: real Homepage New In copy missing`);

                const metrics = await rail.evaluate(el => ({scrollWidth:el.scrollWidth, clientWidth:el.clientWidth, scrollLeft:el.scrollLeft}));
                if (metrics.scrollWidth <= metrics.clientWidth) throw new Error(`${width}: ProductRail is not horizontally overflowed ${JSON.stringify(metrics)}`);

                await rail.evaluate(el => { el.scrollLeft = Math.min(180, el.scrollWidth - el.clientWidth); });
                await page.waitForTimeout(150);
                const scrolledX = await rail.evaluate(el => el.scrollLeft);
                if (scrolledX <= 0) throw new Error(`${width}: ProductRail did not scroll horizontally`);
                await rail.evaluate(el => { el.scrollLeft = 0; });

                const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
                if (overflow > 1) throw new Error(`${width}: horizontal page overflow ${overflow}`);

                const firstLink = rail.locator('a[href^="/shop/"]').first();
                const href = await firstLink.getAttribute('href');
                if (!href) throw new Error(`${width}: first product link missing`);

                if (width < 1024) {
                  const dots = section.locator('button[role="tab"]');
                  if (await dots.count() < 2) throw new Error(`${width}: dot controls missing`);
                  const x0 = await rail.evaluate(el => el.scrollLeft);
                  await dots.nth(1).click();
                  await page.waitForTimeout(750);
                  const x1 = await rail.evaluate(el => el.scrollLeft);
                  if (x1 <= x0 + 20) throw new Error(`${width}: dot control did not move rail ${x0}->${x1}`);
                  const swipeVisible = await section.getByText('Swipe', {exact:true}).count();
                  if (!swipeVisible) throw new Error(`${width}: SWIPE affordance missing`);
                }

                if (width === 1440) {
                  await page.evaluate(() => window.scrollTo(0,0));
                  const y0 = await page.evaluate(() => window.scrollY);
                  await page.mouse.wheel(0, 600);
                  await page.waitForTimeout(900);
                  const y1 = await page.evaluate(() => window.scrollY);
                  if (y1 <= y0 + 100) throw new Error(`1440: desktop wheel scroll failed ${y0}->${y1}`);
                }

                if (runtimeErrors.length) throw new Error(`${width}: runtime console errors ${JSON.stringify(runtimeErrors)}`);
                results.push({width,newIn:true,subtitle:true,railMetrics:metrics,programmaticScrollLeft:scrolledX,pageOverflow:overflow,firstProductHref:href,runtimeErrors:[]});
                await page.screenshot({path:`release-smoke-${width}.png`, fullPage:false});
                await context.close();
              }
            } finally {
              fs.writeFileSync('release-smoke-results.json', JSON.stringify(results, null, 2));
              await browser.close();
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-release-gate-evidence
          path: |
            release-smoke-*.png
            release-smoke-results.json

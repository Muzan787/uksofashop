name: Phase 2A native gesture QA

on:
  push:
    branches: [fix/homepage-mobile-scroll-trap]

jobs:
  gesture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 8de4c3ff2ef774e5d1311311c5391331587775a7
      NEXT_PUBLIC_SUPABASE_URL: https://nznpeqjnoobhyxwnmsez.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_tMk28Ay_hIljhv8NQcV01Q_cI9ApS9c
      QA_URL: http://127.0.0.1:3000
      NODE_PATH: /tmp/pw96/node_modules
      PLAYWRIGHT_BROWSERS_PATH: /tmp/pw96-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build production app
        run: |
          npm ci
          npx eslint src/components/Home/ProductRail.tsx
          npx tsc --noEmit
          npm run build
          git diff --check "$BASE_SHA"...HEAD
          test "$(git diff --name-only "$BASE_SHA"...HEAD | grep -v '^\.github/workflows/p2a-validation.yml$')" = "src/components/Home/ProductRail.tsx"
      - name: Install Chromium 96 harness
        run: |
          mkdir -p /tmp/pw96 /tmp/pw96-browsers
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix /tmp/pw96 playwright@1.15.2
          /tmp/pw96/node_modules/.bin/playwright install chromium
      - name: Start app
        run: |
          nohup npm run start >/tmp/ukss-next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$QA_URL/" >/tmp/home.html 2>/dev/null && grep -q 'The latest' /tmp/home.html && exit 0
            sleep 2
          done
          cat /tmp/ukss-next.log
          exit 1
      - name: Native touch gesture matrix
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const widths = [320,390,430,768];
          const results = [];

          async function protect(page) {
            await page.route('**/api/attribution/**', r => r.fulfill({status:204, body:''}));
            await page.route('**/api/meta/**', r => r.fulfill({status:204, body:''}));
            await page.route(/google-analytics\.com|googletagmanager\.com|connect\.facebook\.net|facebook\.com\/tr/, r => r.abort());
          }
          async function getParts(page) {
            const heading = page.locator('h2[aria-label="The latest through the door."]').first();
            await heading.waitFor({state:'attached', timeout:30000});
            const section = heading.locator('xpath=ancestor::section[1]');
            const rail = section.locator('div.overflow-x-auto').first();
            await rail.waitFor({state:'visible'});
            return {heading,section,rail};
          }
          async function targetFor(rail, kind) {
            const card = rail.locator(':scope > *').first();
            if (kind === 'image') return card.locator('[data-card-media]');
            if (kind === 'title') return card.locator('h3');
            if (kind === 'price') return card.locator('span.font-data').first();
            return card;
          }
          async function startPoint(rail, kind) {
            const card = rail.locator(':scope > *').first();
            let b;
            if (kind === 'image') b = await card.locator('[data-card-media]').boundingBox();
            if (kind === 'title') b = await card.locator('h3').boundingBox();
            if (kind === 'price') b = await card.locator('span.font-data').first().boundingBox();
            if (kind === 'gap') {
              const a = await rail.locator(':scope > *').nth(0).boundingBox();
              const c = await rail.locator(':scope > *').nth(1).boundingBox();
              if (!a || !c) throw new Error('gap missing');
              return {x:(a.x+a.width+c.x)/2, y:a.y+Math.min(a.height/2,240)};
            }
            if (!b) throw new Error(`${kind} missing`);
            return {x:b.x+b.width/2, y:b.y+b.height/2};
          }
          async function reset(page, rail, kind) {
            await page.evaluate(() => window.scrollTo(0,0));
            await rail.evaluate(el => el.scrollLeft = 0);
            await targetFor(rail, kind === 'gap' ? 'image' : kind).scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);
          }
          async function nativeGesture(page, p, xDistance, yDistance) {
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('Input.synthesizeScrollGesture', {
              x: Math.round(p.x), y: Math.round(p.y),
              xDistance, yDistance,
              speed: 500,
              preventFling: true,
              gestureSourceType: 'touch'
            });
            await page.waitForTimeout(900);
          }
          async function run(page, rail, name, kind, xd, yd) {
            await reset(page,rail,kind);
            const p = await startPoint(rail,kind);
            const hit = await page.evaluate(({x,y}) => { const e=document.elementFromPoint(x,y); return e ? `${e.tagName}.${e.className}` : null; }, p);
            const before={y:await page.evaluate(()=>window.scrollY),x:await rail.evaluate(el=>el.scrollLeft)};
            await nativeGesture(page,p,xd,yd);
            const after={y:await page.evaluate(()=>window.scrollY),x:await rail.evaluate(el=>el.scrollLeft)};
            const r={name,kind,start:p,hit,before,after,pageDelta:after.y-before.y,railDelta:after.x-before.x};
            console.log(JSON.stringify(r));
            return r;
          }
          function vertical(r){ if(r.pageDelta<50||Math.abs(r.railDelta)>45) throw new Error(`${r.name} vertical FAIL ${JSON.stringify(r)}`); }
          function horizontal(r){ if(r.railDelta<35||Math.abs(r.pageDelta)>70) throw new Error(`${r.name} horizontal FAIL ${JSON.stringify(r)}`); }

          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            console.log(`Chromium=${browser.version()}`);
            try{
              for(const width of widths){
                const context=await browser.newContext({viewport:{width,height:width===768?1024:844},isMobile:width<768,hasTouch:true});
                const page=await context.newPage(); await page.emulateMedia({reducedMotion:'no-preference'}); await protect(page); await page.goto(process.env.QA_URL,{waitUntil:'domcontentloaded'});
                const {section,rail}=await getParts(page); const cases=[]; let r;

                await page.evaluate(()=>window.scrollTo(0,0)); await page.waitForTimeout(300);
                const controlBefore=await page.evaluate(()=>scrollY);
                await nativeGesture(page,{x:Math.min(40,width-10),y:Math.min(650,(width===768?1024:844)-40)},0,-180);
                const controlAfter=await page.evaluate(()=>scrollY);
                console.log(JSON.stringify({width,controlBefore,controlAfter,controlDelta:controlAfter-controlBefore}));
                if(controlAfter-controlBefore<40) throw new Error(`${width} native compositor control gesture failed ${controlBefore}->${controlAfter}`);

                r=await run(page,rail,'vertical-image','image',0,-190); vertical(r); cases.push(r);
                r=await run(page,rail,'vertical-title','title',0,-170); vertical(r); cases.push(r);
                r=await run(page,rail,'horizontal-image','image',-200,0); horizontal(r); cases.push(r);
                r=await run(page,rail,'diagonal-vertical','image',-35,-190); vertical(r); cases.push(r);
                r=await run(page,rail,'diagonal-horizontal','image',-200,-35); horizontal(r); cases.push(r);
                r=await run(page,rail,'vertical-price','price',0,-160); vertical(r); cases.push(r);
                r=await run(page,rail,'vertical-gap','gap',0,-160); vertical(r); cases.push(r);
                r=await run(page,rail,'horizontal-gap','gap',-180,0); horizontal(r); cases.push(r);
                await reset(page,rail,'image');
                const dots=section.getByRole('tab');
                if(await dots.count()>1){ const x0=await rail.evaluate(el=>el.scrollLeft); await dots.nth(1).click(); await page.waitForTimeout(700); const x1=await rail.evaluate(el=>el.scrollLeft); if(x1<=x0+20) throw new Error(`${width} dot FAIL`); }
                const href=await rail.locator(':scope > *').first().locator('a[href^="/shop/"]').first().getAttribute('href');
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
                if(!href||overflow>1) throw new Error(`${width} regression FAIL href=${href} overflow=${overflow}`);
                results.push({width,cases,href,overflow}); await page.screenshot({path:`p2a-${width}.png`}); await context.close();
              }
              const context=await browser.newContext({viewport:{width:1440,height:1000}}); const page=await context.newPage(); await protect(page); await page.goto(process.env.QA_URL,{waitUntil:'domcontentloaded'}); const {rail}=await getParts(page); await targetFor(rail,'image').scrollIntoViewIfNeeded(); const y0=await page.evaluate(()=>scrollY); await page.mouse.wheel(0,500); await page.waitForTimeout(700); const y1=await page.evaluate(()=>scrollY); const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth); if(y1<=y0+100||overflow>1) throw new Error(`desktop FAIL y ${y0}->${y1} overflow ${overflow}`); results.push({width:1440,desktop:{y0,y1,overflow}}); await page.screenshot({path:'p2a-1440.png'}); await context.close();
            } finally { fs.writeFileSync('p2a-results.json',JSON.stringify(results,null,2)); await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2a-native-evidence
          path: |
            p2a-*.png
            p2a-results.json

name: R2 live-QA hotfix validation

on:
  push:
    branches:
      - r2-live-qa
    paths:
      - '.github/workflows/r2-hotfix-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-final-signoff-hotfix
          fetch-depth: 0
      - run: npm ci
      - name: Changed-file ESLint
        run: npx eslint src/components/Layout/WhatsAppFab.tsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Diff gate
        run: |
          git diff --check 197d81a5a676e12cdd05e6696e5f3c7954d6332c..HEAD
          test "$(git diff --name-only 197d81a5a676e12cdd05e6696e5f3c7954d6332c..HEAD)" = "src/components/Layout/WhatsAppFab.tsx"

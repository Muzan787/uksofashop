name: Offer Phase D validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/app/actions/checkout.ts'
      - 'src/components/Checkout/**'
      - 'src/components/Product/DeliveryEstimator.tsx'
      - 'src/constants/delivery.ts'
      - 'src/utils/postcode.ts'
      - 'src/app/api/qa/phase-d-server/route.ts'
      - 'src/app/qa/phase-d-estimator/page.tsx'
      - 'scripts/phase-d-postcode-policy.test.mjs'
      - 'scripts/phase-d-local-browser-qa.mjs'
      - 'scripts/phase-d-final-browser-qa.mjs'
      - 'scripts/phase-d-fetch-fixture.mjs'
      - 'scripts/phase-d-https-server.mjs'
      - 'supabase/migrations/20260909110000_offer_phase_d_mainland_delivery_rpc_lock.sql'
      - '.github/workflows/phase-d-validation.yml'

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://nznpeqjnoobhyxwnmsez.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56bnBlcWpub29iaHl4d25tc2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NjU4MDAsImV4cCI6MjA4NzI0MTgwMH0.iDLleSh0WTovhhCvG0re19vltaNurUgJRKCCyYpQMA0
  SUPABASE_SERVICE_ROLE_KEY: phase-d-qa-service-role-not-a-production-secret
  NEXT_PUBLIC_HOMEDATA_API_KEY: phase-d-qa-homedata
  NEXT_PUBLIC_SITE_URL: https://127.0.0.1:3100
  PHASE_D_QA_ENABLE: '1'

jobs:
  exact-tree-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head, not GitHub merge synthesis
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove production blobs are exact 98f6 candidate
        run: |
          echo "QA_HEAD=$(git rev-parse HEAD)"
          echo "PHASE_D_PRODUCTION_SOURCE=98f6b02eed5ea5b4cb82d7d6c3b0c04e200a2d08"
          git diff --exit-code 98f6b02eed5ea5b4cb82d7d6c3b0c04e200a2d08 HEAD -- \
            src/utils/postcode.ts \
            src/app/actions/checkout.ts \
            src/components/Checkout/CheckoutClient.tsx \
            src/components/Checkout/MobileTotalBar.tsx \
            src/components/Product/DeliveryEstimator.tsx \
            src/constants/delivery.ts \
            supabase/migrations/20260909110000_offer_phase_d_mainland_delivery_rpc_lock.sql

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Exact candidate production build
        run: npm run build

      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Generate QA-only TLS certificate
        run: |
          mkdir -p .qa/screenshots
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout .qa/key.pem -out .qa/cert.pem -days 1 \
            -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1'

      - name: Start exact Next production build directly over HTTPS
        run: |
          NODE_OPTIONS="--import=$(pwd)/scripts/phase-d-fetch-fixture.mjs" \
          PHASE_D_TLS_KEY="$(pwd)/.qa/key.pem" \
          PHASE_D_TLS_CERT="$(pwd)/.qa/cert.pem" \
          nohup node scripts/phase-d-https-server.mjs > .qa/server.log 2>&1 &
          echo $! > .qa/server.pid
          for i in $(seq 1 40); do
            if curl -ksS --max-time 5 https://127.0.0.1:3100/checkout >/dev/null; then
              echo 'Direct HTTPS candidate is ready.'
              exit 0
            fi
            sleep 1
          done
          cat .qa/server.log
          exit 1

      - name: Exact-tree consolidated Phase D browser and server-action matrix
        env:
          PHASE_D_LOCAL_URL: https://127.0.0.1:3100
        run: node scripts/phase-d-final-browser-qa.mjs

      - name: Preserve consolidated QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-d-final-qa-${{ github.run_id }}
          path: |
            .qa/phase-d-results.json
            .qa/screenshots/*.png
            .qa/server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop QA HTTPS server
        if: always()
        run: |
          if [ -f .qa/server.pid ]; then kill "$(cat .qa/server.pid)" || true; fi

      - name: Diff whitespace check
        run: git diff --check origin/master...HEAD

      - name: Protected-path diff guard
        run: |
          changed="$(git diff --name-only origin/master...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(src/utils/tracking\.ts|src/utils/orderConversions\.ts|src/utils/metaCapi\.ts|src/utils/ga4Server\.ts|src/utils/attribution/|src/context/CartContext\.tsx|src/components/Checkout/CartStep\.tsx|src/components/Product/(ProductPageClient|BuyBox|Reviews)|.*confirm_order|.*offer_entitlements)'; then
            echo 'Protected Phase B/C/tracking path changed unexpectedly.' >&2
            exit 1
          fi

name: Offer Phase C live production final

on:
  push:
    branches: [qa/offer-phase-c-live-production-final]
    paths: [.github/workflows/offer-phase-c-live-production-final.yml]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FINAL_SHA: e4b138a5f344fae43cbb8d37d9e7dc2072082d69
      BASE: https://www.uksofashop.co.uk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact production master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$FINAL_SHA"
          echo MASTER_EXACT_SHA=PASS

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install -g playwright@1.55.0
          playwright install --with-deps chromium

      - name: Focused live production browser matrix
        shell: bash
        env:
          NODE_PATH: /usr/local/lib/node_modules
        run: |
          set -euo pipefail
          cat >/tmp/phasec-live-final.cjs <<'JS'
          const {chromium}=require('playwright'),assert=require('assert'),fs=require('fs')
          const BASE=process.env.BASE
          const ACTIVE='Your online offer is active · SOFAEXTRA · FREE UK Mainland Delivery'
          const PROMPT='Your online sofa offer is active'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms))
          const results={}
          const vids={
            w320:'90000000-0000-4000-8000-000000000320',
            w390:'90000000-0000-4000-8000-000000000390',
            w430:'90000000-0000-4000-8000-000000000430',
            w768:'90000000-0000-4000-8000-000000000768',
            w1440:'90000000-0000-4000-8000-000000001440',
            organic430:'90000000-0000-4000-8000-000000004301',
            organic1440:'90000000-0000-4000-8000-000000014401',
            fbclid:'90000000-0000-4000-8000-000000000999',
            clean:'90000000-0000-4000-8000-000000000998',
          }
          const P={
            electric:{variant_id:'1ba97d1f-f890-48f8-8ab9-57cbb147f388',quantity:1,price:999,title:'Hannah Electric Corner',color:'Beige',image_url:''},
            roma:{variant_id:'4b6dc9c2-91ec-432f-9735-abb6899b1a95',quantity:1,price:350,title:'Roma Recliner 2 Seater Manual Sofa',color:'Black',image_url:''},
            standard:{variant_id:'ff3c0414-77ba-40ef-b6b2-bd97bff2bd17',quantity:1,price:649,title:'Bishop U shaped Scattered Back Sofa',color:'Truffle',image_url:''},
            verona:{variant_id:'01921b2b-5fe9-47d3-8eb6-b53adba27e82',quantity:1,price:349,title:'Verona 2 Seater Scattered Back',color:'Grey',image_url:''},
            footstool:{variant_id:'f262accc-1287-4375-984e-e677afd5aa01',quantity:1,price:149,title:'Lily Footstool',color:'Grey',image_url:''},
          }
          const longVerona={variant_id:'a5d2050d-c458-4e0c-b3b3-7b7c727845a0',quantity:1,price:549,title:'Verona 4 Seater Corner 1c2 High Back',color:'Grey',image_url:'',fabric_id:'6ce3d2c2-7f92-4276-b991-70afa07c0cf9',fabric_label:'Chenille Grey',fabric_code:'CH12',fabric_swatch:null}
          const clone=x=>JSON.parse(JSON.stringify(x))
          const money=n=>`£${Number(n).toFixed(2)}`
          const occ=(s,n)=>String(s).split(n).length-1
          const pass=k=>{results[k]='PASS';console.log(`${k}=PASS`)}
          function overlap(a,b){return !!a&&!!b&&a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y}
          async function noOverflow(p,l){const x=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,iw:innerWidth}));assert(x.sw<=x.iw+1,`${l}: overflow ${x.sw}>${x.iw}`)}
          function instrument(p){const s={pageErrors:[],consoleErrors:[],qualify:0,status:0};p.on('pageerror',e=>s.pageErrors.push(String(e.stack||e)));p.on('console',m=>{if(m.type()==='error'&&/(?:Uncaught|TypeError|ReferenceError|Unhandled|Hydration|Minified React error)/i.test(m.text()))s.consoleErrors.push(m.text())});p.on('request',r=>{if(r.url().includes('/api/offer/qualify'))s.qualify++;if(r.url().includes('/api/offer/status'))s.status++});return s}
          async function runtime(st,l){assert.deepStrictEqual(st.pageErrors,[],`${l}: page errors`);assert.deepStrictEqual(st.consoleErrors,[],`${l}: console errors`);assert(st.qualify<10,`${l}: qualification loop ${st.qualify}`);assert(st.status<30,`${l}: status loop ${st.status}`)}
          async function seed(c,vid){await c.addCookies([{name:'uksofashop_vid',value:vid,url:BASE,secure:true,sameSite:'Lax'}]);await c.addInitScript(()=>localStorage.setItem('cookie_consent','denied'))}
          async function ctx(browser,w,vid){const c=await browser.newContext({viewport:{width:w,height:w<=430?900:1000},hasTouch:w<=430,isMobile:w<=430,serviceWorkers:'allow'});await seed(c,vid);return c}
          async function persistent(dir,w,vid,seedVid=true){const c=await chromium.launchPersistentContext(dir,{headless:true,viewport:{width:w,height:w<=430?900:1000},hasTouch:w<=430,isMobile:w<=430,serviceWorkers:'allow'});await c.addInitScript(()=>localStorage.setItem('cookie_consent','denied'));if(seedVid)await c.addCookies([{name:'uksofashop_vid',value:vid,url:BASE,secure:true,sameSite:'Lax'}]);return c}
          async function go(p,path){const r=await p.goto(BASE+path,{waitUntil:'domcontentloaded',timeout:30000});assert(r&&r.status()<500,`${path}: HTTP`);await p.locator('body').waitFor({state:'visible'});await sleep(550)}
          async function status(p){return p.evaluate(async()=>{const r=await fetch('/api/offer/status',{cache:'no-store'});return r.json()})}
          async function waitActive(p){await p.getByText(ACTIVE,{exact:true}).waitFor({state:'visible',timeout:15000});assert((await status(p)).active)}
          async function closePrompt(p){const d=p.getByRole('dialog',{name:PROMPT});if(await d.isVisible().catch(()=>false))await d.getByRole('button',{name:/Close your online sofa offer is active/i}).click()}
          async function setCart(p,items){await p.evaluate(x=>localStorage.setItem('uksofashop_cart',JSON.stringify(x)),items);await go(p,'/checkout');await p.getByRole('button',{name:/Continue to delivery/i}).waitFor({state:'visible',timeout:12000})}
          async function delivery(p){await p.getByRole('button',{name:/Continue to delivery/i}).click();await p.getByText('Delivery Information',{exact:true}).waitFor({timeout:12000});await sleep(500)}
          async function backCart(p){await p.getByRole('button',{name:/Back to Cart/i}).click();await p.getByRole('button',{name:/Continue to delivery/i}).waitFor({timeout:12000})}
          async function summaryText(p,w){
            if(w>=1024){const a=p.locator('[data-ground="dark"]').filter({hasText:'Order Summary'});for(let i=(await a.count())-1;i>=0;i--)if(await a.nth(i).isVisible().catch(()=>false))return a.nth(i).innerText();throw new Error(`${w}: desktop summary missing`)}
            const t=p.locator('[data-bottom-bar] button[aria-controls="mobile-summary"]');await t.waitFor({state:'visible',timeout:12000});if((await t.getAttribute('aria-expanded'))!=='true'){await t.click();await sleep(180)}return p.locator('#mobile-summary [data-ground="dark"]').innerText()
          }
          async function closeSummary(p){const b=p.getByRole('button',{name:'Close order summary'});if(await b.isVisible().catch(()=>false)){await b.click();await sleep(120)}}
          async function assertOffer(p,w,{subtotal,discount,total,label,manual=false,zero=false}){await sleep(600);const t=await summaryText(p,w);assert(t.includes('Subtotal')&&t.includes(money(subtotal)),`${label}: subtotal`);assert(t.includes('Delivery · UK Mainland')&&t.includes('FREE'),`${label}: delivery`);assert(t.includes('Nothing to pay today'),`${label}: COD`);assert(t.includes(money(total)),`${label}: total`);if(manual)assert(t.includes('Offer · SOFAEXTRA'),`${label}: manual label`);else assert(t.includes('Online offer'),`${label}: auto label`);if(discount>0)assert(t.includes(`−£${discount.toFixed(2)}`),`${label}: discount`);if(zero){assert(!t.includes('−£20.00')&&!t.includes('−£30.00')&&!t.includes('−£50.00'),`${label}: excluded discount`)}await noOverflow(p,label);return t}
          async function assertNoOffer(p,w,subtotal,label){await sleep(600);const t=await summaryText(p,w);assert(t.includes('Subtotal')&&t.includes(money(subtotal)),`${label}: subtotal`);assert(t.includes('Delivery · UK Mainland')&&t.includes('FREE'),`${label}: delivery`);assert(t.includes('Nothing to pay today')&&t.includes(money(subtotal)),`${label}: total`);assert(!t.includes('Online offer')&&!t.includes('Offer · SOFAEXTRA'),`${label}: unexpected offer`);await noOverflow(p,label);return t}
          async function applyCode(p,code,expectError=false){await closeSummary(p);const trig=p.getByRole('button',{name:/Have an offer code\?/i});if(await trig.isVisible().catch(()=>false))await trig.click();await p.getByLabel('Offer code').fill(code);await p.getByRole('button',{name:/^Apply$/i}).click();if(expectError)await p.getByText('Offer code not recognised.',{exact:true}).waitFor({timeout:12000});else await sleep(800)}
          async function fixedMobile(p,w){const nav=await p.locator('nav[aria-label="Primary"]').boundingBox();const wa=await p.getByRole('link',{name:'Chat with us on WhatsApp'}).boundingBox();const bar=p.locator('[data-bottom-bar]').filter({has:p.locator('button[aria-controls="mobile-summary"]')});const bb=await bar.boundingBox();assert(nav&&wa&&bb,`${w}: fixed element missing`);assert(!overlap(nav,bb)&&!overlap(wa,bb)&&!overlap(nav,wa),`${w}: fixed overlap`);await noOverflow(p,`fixed-${w}`)}

          ;(async()=>{
            const browser=await chromium.launch({headless:true})
            try{
              // 320: Meta paid, sheet, security, direct return, Electric, fixed UI, popup once across persistent reopen.
              let c=await persistent('/tmp/phasec-live-320',320,vids.w320,true);let p=c.pages()[0]||await c.newPage();let st=instrument(p)
              await go(p,'/?utm_source=facebook&utm_medium=paid_social&utm_campaign=PHASEC_LIVE_320');await waitActive(p)
              let d=p.getByRole('dialog',{name:PROMPT});await d.waitFor({state:'visible',timeout:12000});assert((await d.innerText()).includes('SOFAEXTRA'))
              const offerCookie=(await c.cookies()).find(x=>x.name==='uksofashop_offer');assert(offerCookie&&offerCookie.httpOnly&&offerCookie.secure&&offerCookie.sameSite==='Lax','320 cookie security');assert(!(await p.evaluate(()=>document.cookie)).includes('uksofashop_offer'),'320 token visible to JS')
              await closePrompt(p);await go(p,'/');await waitActive(p);await sleep(700);assert(!(await d.isVisible().catch(()=>false)),'320 popup repeated on direct return')
              await setCart(p,[clone(P.electric)]);await delivery(p);await assertOffer(p,320,{subtotal:999,discount:50,total:949,label:'LIVE_320_ELECTRIC'});await closeSummary(p);await fixedMobile(p,320);await runtime(st,'live320-first');await c.close()
              c=await persistent('/tmp/phasec-live-320',320,vids.w320,false);p=c.pages()[0]||await c.newPage();st=instrument(p);await go(p,'/');await waitActive(p);d=p.getByRole('dialog',{name:PROMPT});await sleep(800);assert(!(await d.isVisible().catch(()=>false)),'320 popup repeated after reopen');await runtime(st,'live320-reopen');await c.close();pass('LIVE_320');pass('LIVE_TOKEN_JS_INVISIBILITY');pass('LIVE_POPUP_ONCE')

              // 390: Google CPC, Standard £20, Verona £0, 2D-A and 2D-B.
              c=await ctx(browser,390,vids.w390);p=await c.newPage();st=instrument(p);await go(p,'/?utm_source=google&utm_medium=cpc&utm_campaign=PHASEC_LIVE_390');await waitActive(p);await closePrompt(p)
              await setCart(p,[clone(P.standard)]);await delivery(p);await assertOffer(p,390,{subtotal:649,discount:20,total:629,label:'LIVE_390_STANDARD'});await closeSummary(p)
              const vals={customerName:'Phase C QA',customerEmail:'phasec.qa@example.invalid',customerPhone:'07123456789',postcode:'BB1 1AA',shippingAddress:'1 QA Street, Blackburn',specialInstructions:'Live Phase C state QA'}
              for(const n of ['customerName','customerEmail','customerPhone'])await p.locator(`input[name="${n}"]`).fill(vals[n]);const pc=p.locator('label').filter({hasText:/Postcode/}).locator('xpath=following-sibling::div//input');await pc.fill(vals.postcode);await p.locator('textarea[name="shippingAddress"]').fill(vals.shippingAddress);await p.locator('textarea[name="specialInstructions"]').fill(vals.specialInstructions);await backCart(p);await delivery(p);for(const n of ['customerName','customerEmail','customerPhone'])assert.strictEqual(await p.locator(`input[name="${n}"]`).inputValue(),vals[n]);assert.strictEqual(await pc.inputValue(),vals.postcode);assert.strictEqual(await p.locator('textarea[name="shippingAddress"]').inputValue(),vals.shippingAddress);assert.strictEqual(await p.locator('textarea[name="specialInstructions"]').inputValue(),vals.specialInstructions);await assertOffer(p,390,{subtotal:649,discount:20,total:629,label:'LIVE_390_P2DA'});await closeSummary(p)
              await setCart(p,[clone(P.verona)]);await delivery(p);await assertOffer(p,390,{subtotal:349,discount:0,total:349,label:'LIVE_390_VERONA',zero:true});await closeSummary(p)
              await setCart(p,[clone(longVerona)]);let body=await p.locator('body').innerText();for(const x of [longVerona.title,'Chenille Grey · CH12','£549'])assert(body.includes(x),`P2DB missing ${x}`);for(const name of [`Remove ${longVerona.title}`,`One more ${longVerona.title}`,`Remove ${longVerona.title} from your cart`]){const b=await p.getByRole('button',{name,exact:true}).boundingBox();assert(b&&b.width>=43&&b.height>=43,`P2DB target ${name}`)}await p.getByRole('button',{name:`Remove ${longVerona.title} from your cart`,exact:true}).click();await p.getByRole('button',{name:/Undo/i}).waitFor({state:'visible',timeout:3000});await p.getByRole('button',{name:/Undo/i}).click();await p.getByRole('heading',{name:longVerona.title,exact:true}).waitFor({state:'visible',timeout:5000});assert((await p.locator('body').innerText()).includes('Chenille Grey · CH12'));await noOverflow(p,'LIVE_390_P2DB');await runtime(st,'live390');await c.close();pass('LIVE_390');pass('LIVE_PHASE_2D_A');pass('LIVE_PHASE_2D_B')

              // 430: Roma, Footstool, invalid code retains entitlement, separate organic manual code.
              c=await ctx(browser,430,vids.w430);p=await c.newPage();st=instrument(p);await go(p,'/?gclid=PHASEC_LIVE_430');await waitActive(p);await closePrompt(p)
              await setCart(p,[clone(P.roma)]);await delivery(p);await assertOffer(p,430,{subtotal:350,discount:30,total:320,label:'LIVE_430_ROMA'});await closeSummary(p)
              await setCart(p,[clone(P.footstool)]);await delivery(p);await assertOffer(p,430,{subtotal:149,discount:0,total:149,label:'LIVE_430_FOOTSTOOL',zero:true});await closeSummary(p)
              await setCart(p,[clone(P.electric)]);await delivery(p);await assertOffer(p,430,{subtotal:999,discount:50,total:949,label:'LIVE_430_AUTO'});await applyCode(p,'NOTVALID',true);await assertOffer(p,430,{subtotal:999,discount:50,total:949,label:'LIVE_430_INVALID_RETAINS'});await closeSummary(p);await fixedMobile(p,430);await runtime(st,'live430-paid');await c.close()
              c=await ctx(browser,430,vids.organic430);p=await c.newPage();st=instrument(p);await go(p,'/');assert(!(await status(p)).active);await setCart(p,[clone(P.electric)]);await delivery(p);await assertNoOffer(p,430,999,'LIVE_430_ORGANIC_BEFORE');await applyCode(p,'SOFAEXTRA');const m430=await assertOffer(p,430,{subtotal:999,discount:50,total:949,label:'LIVE_430_MANUAL',manual:true});assert.strictEqual(occ(m430,'−£50.00'),1,'430 manual duplicate');await runtime(st,'live430-organic');await c.close();pass('LIVE_430')

              // 768: desktop offer modal + Header + mixed order-level offer.
              c=await ctx(browser,768,vids.w768);p=await c.newPage();st=instrument(p);await go(p,'/?utm_source=facebook&utm_medium=paid_social&utm_campaign=PHASEC_LIVE_768');await waitActive(p);d=p.getByRole('dialog',{name:PROMPT});await d.waitFor({state:'visible',timeout:12000});await closePrompt(p);await setCart(p,[clone(P.electric),clone(P.roma),clone(P.standard),clone(P.verona)]);await delivery(p);const mix=await assertOffer(p,768,{subtotal:2347,discount:50,total:2297,label:'LIVE_768_MIXED'});assert.strictEqual(occ(mix,'−£50.00'),1,'768 discount stacked');assert(!mix.includes('−£30.00')&&!mix.includes('−£20.00'),'768 lower tier stacked');await noOverflow(p,'LIVE_768');await runtime(st,'live768');await c.close();pass('LIVE_768')

              // 1440: desktop modal, valid code no stack, extras; separate ordinary organic/no-code.
              c=await ctx(browser,1440,vids.w1440);p=await c.newPage();st=instrument(p);await go(p,'/?utm_source=google&utm_medium=cpc&utm_campaign=PHASEC_LIVE_1440');await waitActive(p);d=p.getByRole('dialog',{name:PROMPT});await d.waitFor({state:'visible',timeout:12000});await closePrompt(p);await setCart(p,[clone(P.electric)]);await delivery(p);await assertOffer(p,1440,{subtotal:999,discount:50,total:949,label:'LIVE_1440_AUTO'});await applyCode(p,'SOFAEXTRA');let t1440=await assertOffer(p,1440,{subtotal:999,discount:50,total:949,label:'LIVE_1440_VALID_CODE',manual:true});assert.strictEqual(occ(t1440,'−£50.00'),1,'1440 token+code stacked');const assembly=p.locator('label').filter({hasText:'Assembly'}).getByRole('checkbox');await assembly.check();await sleep(600);t1440=await summaryText(p,1440);assert(t1440.includes('Assembly')&&t1440.includes('£20.00')&&t1440.includes('£969.00'),'1440 extras total');assert.strictEqual(occ(t1440,'−£50.00'),1,'1440 extras duplicated discount');await noOverflow(p,'LIVE_1440');await runtime(st,'live1440-paid');await c.close()
              c=await ctx(browser,1440,vids.organic1440);p=await c.newPage();st=instrument(p);await go(p,'/');assert(!(await status(p)).active);assert(!(await p.locator('body').innerText()).includes(ACTIVE));await setCart(p,[clone(P.electric)]);await delivery(p);await assertNoOffer(p,1440,999,'LIVE_1440_ORGANIC');await runtime(st,'live1440-organic');await c.close();pass('LIVE_1440')

              // Negative/security smokes in independent browsers.
              c=await ctx(browser,390,vids.fbclid);p=await c.newPage();st=instrument(p);await go(p,'/?fbclid=PHASEC_LIVE_NEGATIVE');await sleep(900);assert(!(await status(p)).active);assert(!(await p.locator('body').innerText()).includes(ACTIVE));assert.strictEqual(st.qualify,0,'fbclid-only unexpectedly attempted qualification');await runtime(st,'live-fbclid');await c.close();pass('LIVE_FBCLID_ONLY_REJECTED')
              c=await ctx(browser,390,vids.clean);p=await c.newPage();st=instrument(p);await go(p,'/');await sleep(900);assert(!(await status(p)).active);assert(!(await p.locator('body').innerText()).includes(ACTIVE));assert(!(await p.evaluate(()=>document.cookie)).includes('uksofashop_offer'));await runtime(st,'live-clean');await c.close();pass('LIVE_CLEAN_BROWSER_ISOLATION')

              fs.writeFileSync('/tmp/phasec-live-final.json',JSON.stringify({finalSha:process.env.FINAL_SHA,results,qaVisitorIds:Object.values(vids)},null,2));console.log(JSON.stringify(results,null,2))
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)})
          JS
          node /tmp/phasec-live-final.cjs
          test -s /tmp/phasec-live-final.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offer-phase-c-live-production-final
          path: /tmp/phasec-live-final.json
          if-no-files-found: warn

name: Phase 2D-A live sign-off

on:
  push:
    branches: [qa/phase2d-a-final-validation]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINAL_SHA: af46a8a2524662c9f573ba055e2194cc0f95245b
      LIVE_URL: https://www.uksofashop.co.uk
      NODE_PATH: /tmp/pw/node_modules
    steps:
      - name: Checkout exact released master
        uses: actions/checkout@v4
        with:
          ref: af46a8a2524662c9f573ba055e2194cc0f95245b
          fetch-depth: 1

      - name: Verify exact released SHA
        run: test "$(git rev-parse HEAD)" = "$FINAL_SHA"

      - name: Prepare browser
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw playwright-core@1.55.0

      - name: Live production state and privacy QA
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const widths = [390, 430, 1440];
          const live = process.env.LIVE_URL;
          const cart = [{
            variant_id:'a5d2050d-c458-4e0c-b3b3-7b7c727845a0', quantity:1, price:549,
            title:'Verona 4 Seater Corner 1c2 High Back', color:'Grey Fabric',
            image_url:'/placeholder.svg', fabric_id:null, fabric_label:null, fabric_code:null, fabric_swatch:null,
          }];
          const values = {
            name:'QA State Test Name', email:'qa-state@example.com', phone:'07700900123',
            postcode:'SW1A 1AA', address:'QA Test Address 123', instructions:'QA persistence marker 2DA',
          };
          const results=[];
          const fail=m=>{throw new Error(m)};

          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            try {
              for (const width of widths) {
                const mobile = width < 768;
                const context=await browser.newContext({
                  viewport:{width,height:mobile?844:1000},
                  isMobile: mobile,
                  hasTouch: mobile,
                  serviceWorkers:'block',
                });
                const page=await context.newPage();
                await page.addInitScript(c=>localStorage.setItem('uksofashop_cart',JSON.stringify(c)),cart);
                // No QA attribution/action writes and no ad-platform calls.
                await page.route('**/api/attribution/**',r=>r.fulfill({status:204,body:''}));
                await page.route('**/api/meta/**',r=>r.fulfill({status:204,body:''}));
                await page.route(/googletagmanager\.com|google-analytics\.com|connect\.facebook\.net|facebook\.com\/tr/,r=>r.fulfill({status:204,body:''}));

                const response=await page.goto(`${live}/checkout`,{waitUntil:'domcontentloaded',timeout:45000});
                if(!response||!response.ok()) fail(`${width}: live HTTP ${response&&response.status()}`);
                const essential=page.getByRole('button',{name:'Essential only'});
                if(await essential.count()){try{await essential.first().click({timeout:1200})}catch{}}

                const next=page.getByRole('button',{name:/Continue to delivery/i});
                await next.waitFor({state:'visible',timeout:15000});
                await next.click();
                const name=page.locator('input[name="customerName"]');
                const email=page.locator('input[name="customerEmail"]');
                const phone=page.locator('input[name="customerPhone"]');
                const postcode=page.locator('label').filter({hasText:'Postcode'}).locator('..').locator('input[type="text"]').first();
                const address=page.locator('textarea[name="shippingAddress"]');
                const instructions=page.locator('textarea[name="specialInstructions"]');
                await name.waitFor({state:'visible',timeout:10000});
                await name.fill(values.name); await email.fill(values.email); await phone.fill(values.phone);
                await postcode.fill(values.postcode); await address.fill(values.address); await instructions.fill(values.instructions);

                await page.getByRole('button',{name:/Back to Cart/i}).click();
                await next.waitFor({state:'visible',timeout:10000});
                await next.click();
                await name.waitFor({state:'visible',timeout:10000});

                const got={
                  name:await name.inputValue(), email:await email.inputValue(), phone:await phone.inputValue(),
                  postcode:await postcode.inputValue(), address:await address.inputValue(), instructions:await instructions.inputValue(),
                };
                for(const k of Object.keys(values)) if(got[k]!==values[k]) fail(`${width}: ${k} not preserved: ${JSON.stringify(got[k])}`);

                const storage=await page.evaluate(()=>({
                  local:Object.fromEntries(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)])),
                  session:Object.fromEntries(Object.keys(sessionStorage).map(k=>[k,sessionStorage.getItem(k)])),
                  cookie:document.cookie,
                }));
                const text=JSON.stringify(storage);
                for(const v of Object.values(values)) if(text.includes(v)) fail(`${width}: PII found in browser storage: ${v}`);

                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
                if(overflow) fail(`${width}: horizontal overflow`);

                let touchUi='desktop';
                if(mobile){
                  const wa=page.getByRole('link',{name:'Chat with us on WhatsApp'});
                  const bar=page.locator('[data-bottom-bar]').first();
                  const nav=page.getByRole('navigation',{name:'Primary'});
                  if(!(await wa.isVisible())||!(await bar.isVisible())||!(await nav.isVisible())) fail(`${width}: mobile fixed UI missing`);
                  const [wb,bb,nb]=await Promise.all([wa.boundingBox(),bar.boundingBox(),nav.boundingBox()]);
                  if(!wb||!bb||!nb) fail(`${width}: mobile fixed UI boxes unavailable`);
                  if(bb.y+bb.height>nb.y+1) fail(`${width}: total bar overlaps nav`);
                  if(wb.y+wb.height>bb.y+1) fail(`${width}: WhatsApp overlaps total bar`);
                  touchUi='touch-emulation-pass';
                }

                results.push({width,sixFieldPersistence:true,privacy:true,horizontalOverflow:false,touchUi});
                await context.close();
              }
            } finally {
              fs.writeFileSync('phase2d-a-live-results.json',JSON.stringify(results,null,2));
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Show live results
        if: always()
        run: test -f phase2d-a-live-results.json && cat phase2d-a-live-results.json || true

      - name: Upload live QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2d-a-live-signoff
          path: phase2d-a-live-results.json
          if-no-files-found: ignore

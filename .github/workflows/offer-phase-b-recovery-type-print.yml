name: Offer Phase B type print surface

on:
  push:
    branches: [fix/offer-phase-b-discount-engine-release]
    paths: [.github/workflows/offer-phase-b-recovery-type-print.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offer-phase-b-discount-engine-release
          fetch-depth: 0
      - name: Replace print-surface any types narrowly
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/app/admin/orders/DirectPrintButton.tsx')
          s=p.read_text()
          anchor="import { ORGANISATION_NAME } from '@/utils/schema'\n"
          if s.count(anchor) != 1:
              raise SystemExit('schema import anchor mismatch')
          s=s.replace(anchor, anchor + "import type { AdminOrderDisplay, AdminOrderItemDisplay } from '@/types/adminOrders'\n", 1)
          old="export default function DirectPrintButton({ order }: { order: any }) {"
          new="export default function DirectPrintButton({ order }: { order: AdminOrderDisplay }) {"
          if s.count(old) != 1:
              raise SystemExit('order prop any anchor mismatch')
          s=s.replace(old,new,1)
          old="${activeOrder.order_items.map((item: any) => `"
          new="${activeOrder.order_items.map((item: AdminOrderItemDisplay) => `"
          if s.count(old) != 1:
              raise SystemExit('item any anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/app/admin/orders/DirectPrintButton.tsx
      - name: Commit typed print surface
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/admin/orders/DirectPrintButton.tsx
          git commit -m "Offer Phase B recovery: type printed order presentation"
          git push origin HEAD:fix/offer-phase-b-discount-engine-release

name: Tracking V2.1 atomic final validation

on:
  push:
    branches: [qa/tracking-v21-real-order-linkage]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      BASE_SHA: bf2eeab6e1f3c1984ecfaf0e2fd1aac5715aeb47
      PHASE2B_SHA: 99e8fd026c3f9ff2eb03a117ba57d6cd58edd595
      FEATURE_BRANCH: fix/tracking-v2-real-order-linkage
      NEXT_PUBLIC_SUPABASE_URL: https://nznpeqjnoobhyxwnmsez.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_tMk28Ay_hIljhv8NQcV01Q_cI9ApS9c
      QA_URL: http://127.0.0.1:3000
      NODE_PATH: /tmp/pw/node_modules
      PGPASSWORD: postgres

    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v4
        with:
          ref: qa/tracking-v21-real-order-linkage
          path: qa
          fetch-depth: 1

      - name: Checkout final Tracking V2.1 candidate
        uses: actions/checkout@v4
        with:
          ref: fix/tracking-v2-real-order-linkage
          path: work
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Verify protected branches and exact final scope
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/master)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/fix/cro-phase2b-trust-delivery | cut -f1)" = "$PHASE2B_SHA"
          grep -q 'data-lenis-prevent-horizontal' src/components/Home/ProductRail.tsx
          git diff --name-only "$BASE_SHA"...HEAD | sort > /tmp/v21-actual.txt
          cat > /tmp/v21-expected.txt <<'EOF'
          src/app/actions/checkout.ts
          src/app/actions/orders.ts
          src/app/api/cron/conversions/route.ts
          src/app/confirm-order/[id]/page.tsx
          src/utils/attribution/checkoutLinkage.ts
          src/utils/attribution/useWhatsAppCTA.ts
          src/utils/attribution/whatsapp.ts
          src/utils/orderConversions.ts
          supabase/migrations/20260907172933_atomic_confirm_order_timestamp.sql
          EOF
          sort -o /tmp/v21-expected.txt /tmp/v21-expected.txt
          diff -u /tmp/v21-expected.txt /tmp/v21-actual.txt
          ! grep -E '^(src/components/Home/ProductRail\.tsx$|src/constants/(delivery|promises|categorySeo)\.ts$|src/components/Home/|src/components/Layout/Footer\.tsx$)' /tmp/v21-actual.txt
          git diff --check "$BASE_SHA"...HEAD
          python ../qa/.github/scripts/tracking_v21_atomic_contract.py

      - name: Static release gates
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          git diff --name-only "$BASE_SHA"...HEAD -- '*.ts' '*.tsx' | sort -u > /tmp/v21-ts-files.txt
          test -s /tmp/v21-ts-files.txt
          xargs npx eslint < /tmp/v21-ts-files.txt
          npx tsc --noEmit
          npm run build
          git diff --check "$BASE_SHA"...HEAD

      - name: Atomic migration database test
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -f ../qa/.github/scripts/tracking_v21_atomic_pg_test.sql

      - name: Deterministic WhatsApp linkage tests
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          cp ../qa/.github/scripts/tracking_v21_linkage_test.ts .tracking_v21_linkage_test.ts
          npx --yes tsx .tracking_v21_linkage_test.ts
          rm .tracking_v21_linkage_test.ts

      - name: Prepare browser
        working-directory: work
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw playwright-core@1.55.0
          command -v google-chrome
          google-chrome --version

      - name: Start final candidate preview
        working-directory: work
        shell: bash
        run: |
          nohup npm run start >/tmp/ukss-v21-final.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "$QA_URL/shop/corner-sofa/verona-high-back-4-seater-corner-1c2" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat /tmp/ukss-v21-final.log
          exit 1

      - name: Consent and WhatsApp browser smoke
        working-directory: work
        run: node ../qa/.github/scripts/tracking_v21_browser_smoke.js

      - name: Collapse feature branch to one clean validated commit
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(git rev-parse HEAD)"
          CURRENT_TREE="$(git rev-parse HEAD^{tree})"
          git config user.name Muzan787
          git config user.email 109960574+Muzan787@users.noreply.github.com
          CLEAN_SHA="$(printf '%s\n' 'Fix Tracking V2.1 real-order attribution linkage' | git commit-tree "$CURRENT_TREE" -p "$BASE_SHA")"
          test "$(git show -s --format=%P "$CLEAN_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$CLEAN_SHA^{tree}")" = "$CURRENT_TREE"
          git push --force-with-lease=refs/heads/$FEATURE_BRANCH:$CURRENT_HEAD origin "$CLEAN_SHA":refs/heads/$FEATURE_BRANCH
          echo "FINAL_FEATURE_SHA=$CLEAN_SHA"
          git diff --name-status "$BASE_SHA" "$CLEAN_SHA"
          git diff --stat "$BASE_SHA" "$CLEAN_SHA"

name: R2 checkout-start production verification

on:
  push:
    branches:
      - r2-live-qa
    paths:
      - '.github/workflows/r2-checkout-start.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-live-qa
          fetch-depth: 0
      - run: npm ci
      - run: npm install --no-save playwright-core@latest
      - name: Exercise checkout_start safely
        run: node qa/r2-checkout-start.mjs
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-checkout-start-evidence
          path: |
            qa-checkout-start.json
            qa-checkout-start.png
      - name: Commit evidence to QA branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qa-checkout-start.json qa-checkout-start.png
          git commit -m 'Record checkout-start production evidence'
          git push origin HEAD:r2-live-qa

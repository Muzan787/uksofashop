name: Offer Phase B clean recovery static QA

on:
  push:
    branches: [fix/offer-phase-b-discount-engine-release]
    paths: [.github/workflows/offer-phase-b-recovery-qa.yml]

jobs:
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3200b9cdd63600bc496bdc1958ed12ce13e8ace0
          fetch-depth: 0
      - name: Verify exact candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "3200b9cdd63600bc496bdc1958ed12ce13e8ace0"
          git fetch origin master
      - name: Install dependencies
        run: npm ci
      - id: lint
        name: Changed-file ESLint
        continue-on-error: true
        run: |
          npx eslint \
            src/app/admin/orders/CopyOrderButton.tsx \
            src/app/admin/orders/DirectPrintButton.tsx \
            src/types/adminOrders.ts
      - id: types
        name: TypeScript
        continue-on-error: true
        run: npx tsc --noEmit
      - id: build
        name: Production build
        continue-on-error: true
        run: npm run build
      - id: diff
        name: Diff check
        continue-on-error: true
        run: git diff --check origin/master...HEAD
      - id: migrations
        name: Migration reconciliation guard
        continue-on-error: true
        run: |
          test -s supabase/migrations/20260908172136_offer_phase_b_discount_engine.sql
          test -s supabase/migrations/20260908172251_offer_phase_b_code_null_fix.sql
          test -s supabase/migrations/20260908173108_offer_phase_b_track_order_totals.sql
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260908172136_*' | wc -l)" -eq 1
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260908172251_*' | wc -l)" -eq 1
          test "$(find supabase/migrations -maxdepth 1 -type f -name '20260908173108_*' | wc -l)" -eq 1
          test ! -e .github/workflows/offer-phase-b-patch-types.yml
      - id: clean
        name: Clean recovery path allowlist
        continue-on-error: true
        run: |
          git diff --name-only origin/master...HEAD | sort > /tmp/changed
          cat > /tmp/expected <<'EOF'
          .github/workflows/offer-phase-b-patch-types.yml
          src/app/admin/orders/CopyOrderButton.tsx
          src/app/admin/orders/DirectPrintButton.tsx
          src/types/adminOrders.ts
          supabase/migrations/20260908172136_offer_phase_b_discount_engine.sql
          supabase/migrations/20260908172251_offer_phase_b_code_null_fix.sql
          supabase/migrations/20260908173108_offer_phase_b_track_order_totals.sql
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/changed
      - id: protected
        name: Protected path guard
        continue-on-error: true
        run: |
          changed="$(git diff --name-only origin/master...HEAD)"
          forbidden='^(src/utils/tracking\.ts|src/utils/orderConversions\.ts|src/utils/metaCapi\.ts|src/utils/ga4Server\.ts|src/utils/attribution/|src/components/UI/AttributionBoot\.tsx|src/components/Checkout/CartStep\.tsx|src/components/Product/ProductPageClient\.tsx|src/components/Product/BuyBox|src/components/Product/Reviews|supabase/migrations/20260907172933_atomic_confirm_order_timestamp\.sql)'
          if printf '%s\n' "$changed" | grep -E "$forbidden"; then
            echo 'Protected path changed in clean recovery delta' >&2
            exit 1
          fi
      - name: Final gate result
        if: always()
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "typescript=${{ steps.types.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          echo "diff=${{ steps.diff.outcome }}"
          echo "migrations=${{ steps.migrations.outcome }}"
          echo "clean=${{ steps.clean.outcome }}"
          echo "protected=${{ steps.protected.outcome }}"
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.types.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.diff.outcome }}" = success
          test "${{ steps.migrations.outcome }}" = success
          test "${{ steps.clean.outcome }}" = success
          test "${{ steps.protected.outcome }}" = success
